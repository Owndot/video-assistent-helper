plugins {
    id 'com.android.application'
}

def signingEnv = ['EVP_KEYSTORE_PATH', 'EVP_STORE_PASSWORD', 'EVP_KEY_ALIAS', 'EVP_KEY_PASSWORD']
def hasReleaseSigning = signingEnv.every { System.getenv(it) }
def runNo = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'de.evp.helfer'
    compileSdk 34

    defaultConfig {
        applicationId 'de.evp.helfer'
        minSdk 26
        targetSdk 34
        versionCode runNo
        versionName "1.0." + runNo
    }

    signingConfigs {
        externalRelease {
            if (hasReleaseSigning) {
                storeFile file(System.getenv('EVP_KEYSTORE_PATH'))
                storePassword System.getenv('EVP_STORE_PASSWORD')
                keyAlias System.getenv('EVP_KEY_ALIAS')
                keyPassword System.getenv('EVP_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.externalRelease
        }
        debug {
            // Separate debug identity; installs alongside the production app.
            applicationIdSuffix '.debug'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

def verifyReleaseSigning = tasks.register('verifyReleaseSigning') {
    doLast {
        if (!hasReleaseSigning || !file(System.getenv('EVP_KEYSTORE_PATH')).isFile()) {
            throw new GradleException('Release signing requires the existing production keystore and EVP_* environment variables. No fallback key is permitted.')
        }
    }
}
tasks.configureEach {
    if (name != 'verifyReleaseSigning' && name.contains('Release') &&
        (name.startsWith('assemble') || name.startsWith('bundle') ||
         name.startsWith('package') || name.startsWith('validateSigning'))) {
        dependsOn verifyReleaseSigning
    }
}
