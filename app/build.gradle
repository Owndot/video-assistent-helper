plugins {
    id 'com.android.application'
}

def signingEnv = ['EVP_KEYSTORE_PATH', 'EVP_STORE_PASSWORD', 'EVP_KEY_ALIAS', 'EVP_KEY_PASSWORD', 'EVP_CERT_SHA256']
def hasReleaseSigning = signingEnv.every { System.getenv(it) }
def runNo = (project.findProperty('migrationFixtureVersion') ?: System.getenv('GITHUB_RUN_NUMBER') ?: System.getenv('RELEASE_VERSION_CODE') ?: '1') as int

android {
    namespace 'de.evp.helfer'
    compileSdk 34

    defaultConfig {
        applicationId 'de.evp.helfer'
        minSdk ((project.findProperty('migrationFixtureMinSdk') ?: '26') as int)
        targetSdk 34
        versionCode runNo
        versionName "1.0." + runNo
    }

    signingConfigs {
        externalRelease {
            if (hasReleaseSigning) {
                storeFile file(System.getenv('EVP_KEYSTORE_PATH'))
                storePassword System.getenv('EVP_STORE_PASSWORD')
                keyAlias System.getenv('EVP_KEY_ALIAS')
                keyPassword System.getenv('EVP_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.externalRelease
        }
        debug {
            // Separate debug identity; installs alongside the production app.
            applicationIdSuffix '.debug'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

def verifyReleaseSigning = tasks.register('verifyReleaseSigning') {
    doLast {
        if (!hasReleaseSigning || !file(System.getenv('EVP_KEYSTORE_PATH')).isFile()) {
            throw new GradleException('Release signing requires the existing production keystore and EVP_* environment variables. No fallback key is permitted.')
        }
        if (!System.getenv('GITHUB_RUN_NUMBER') && !System.getenv('RELEASE_VERSION_CODE')) {
            throw new GradleException('Local release builds require an explicit increasing RELEASE_VERSION_CODE.')
        }
        if (runNo <= 0) throw new GradleException('Release versionCode must be positive.')
        def expected = System.getenv('EVP_CERT_SHA256').replaceAll('[:\\s]', '').toLowerCase(java.util.Locale.ROOT)
        if (!(expected ==~ /[0-9a-f]{64}/)) throw new GradleException('Invalid expected production certificate SHA-256.')
        // Verified compromised identity: never sign another ordinary release with this key.
        if (expected == 'ec17fab1a92079911ea50e6d308f8c70ad79efc3bb48e0231f2559b26b7e42e5') {
            throw new GradleException('Exposed production signing identity is blocked. Migration requires separate approval; use a disposable test identity for validation.')
        }
        def ks = java.security.KeyStore.getInstance('JKS')
        file(System.getenv('EVP_KEYSTORE_PATH')).withInputStream { input ->
            ks.load(input, System.getenv('EVP_STORE_PASSWORD').toCharArray())
        }
        def alias = System.getenv('EVP_KEY_ALIAS')
        if (!ks.isKeyEntry(alias)) throw new GradleException('Release alias is not a private-key entry.')
        def cert = ks.getCertificate(alias)
        def actual = java.security.MessageDigest.getInstance('SHA-256').digest(cert.encoded).encodeHex().toString()
        if (actual != expected) throw new GradleException('Production signing identity mismatch; refusing release build.')
    }
}
tasks.configureEach {
    if (name != 'verifyReleaseSigning' && name.contains('Release') &&
        (name.startsWith('assemble') || name.startsWith('bundle') ||
         name.startsWith('package') || name.startsWith('validateSigning'))) {
        dependsOn verifyReleaseSigning
    }
}

def verifyReleaseApk = tasks.register('verifyReleaseApk') {
    dependsOn 'packageRelease', verifyReleaseSigning
    doLast {
        def apk = file('build/outputs/apk/release/app-release.apk')
        if (!apk.isFile()) throw new GradleException('Release APK missing.')
        def suffix = System.getProperty('os.name').toLowerCase(java.util.Locale.ROOT).contains('windows') ? '.bat' : ''
        def signer = new File(android.sdkDirectory, "build-tools/${android.buildToolsVersion}/apksigner" + suffix)
        if (!signer.isFile()) throw new GradleException('Android SDK apksigner missing; release cannot be verified.')
        def output = new ByteArrayOutputStream()
        exec {
            commandLine signer.absolutePath, 'verify', '--verbose', '--print-certs', apk.absolutePath
            standardOutput = output
        }
        def fingerprints = (output.toString('UTF-8') =~ /Signer #\d+ certificate SHA-256 digest: ([0-9a-fA-F]+)/).collect { it[1].toLowerCase(java.util.Locale.ROOT) }
        def expected = System.getenv('EVP_CERT_SHA256').replaceAll('[:\\s]', '').toLowerCase(java.util.Locale.ROOT)
        if (fingerprints.size() != 1 || fingerprints[0] != expected) {
            throw new GradleException('Finished APK does not have the expected production signer.')
        }
    }
}
tasks.configureEach { if (name == 'assembleRelease') dependsOn verifyReleaseApk }
