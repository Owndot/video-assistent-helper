plugins {
    id 'com.android.application'
}

def runNo = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'de.evp.helfer'
    compileSdk 34

    defaultConfig {
        applicationId 'de.evp.helfer'
        minSdk 26
        targetSdk 34
        versionCode runNo
        versionName "1.0." + runNo
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix '.debug'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

tasks.configureEach {
    if (name.contains('Release') &&
        (name.startsWith('assemble') || name.startsWith('bundle') ||
         name.startsWith('package') || name.startsWith('validateSigning'))) {
        doFirst { throw new GradleException('Release builds paused: exposed signing identity requires an explicit migration decision.') }
    }
}
