plugins {
    id 'com.android.application'
}

def runNo = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'de.evp.helfer'
    compileSdk 34

    defaultConfig {
        applicationId 'de.evp.helfer'
        minSdk 26
        targetSdk 34
        versionCode runNo
        versionName "1.0." + runNo
    }

    // Fester Schlüssel: so lässt sich jede neue Version einfach über die alte installieren
    signingConfigs {
        fest {
            storeFile rootProject.file('keystore.jks')
            storePassword 'evphelfer'
            keyAlias 'evp'
            keyPassword 'evphelfer'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fest
        }
        debug {
            signingConfig signingConfigs.fest
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
