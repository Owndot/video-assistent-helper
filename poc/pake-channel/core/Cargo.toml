[package]
name = "kadri-pairing-poc"
version = "0.0.0"
edition = "2021"
publish = false
description = "ISOLATED FEASIBILITY PROOF ONLY - throwaway identities, not production code"
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
wasm = ["dep:wasm-bindgen", "getrandom03/wasm_js", "getrandom04/wasm_js"]
jni = ["dep:jni"]

# Exact pins: this PoC evaluates these specific releases, nothing newer.
[dependencies]
pakery-spake2 = "=0.6.2"
pakery-core = "=0.6.2"
pakery-crypto = { version = "=0.6.2", default-features = false, features = ["p256", "spake2", "argon2", "std"] }
snow = { version = "=0.10.0", default-features = false, features = ["default-resolver", "use-chacha20poly1305", "use-sha2", "use-curve25519", "use-getrandom"] }
rand_core = "=0.10.1"
getrandom04 = { package = "getrandom", version = "0.4", features = ["sys_rng"] }
getrandom03 = { package = "getrandom", version = "0.3" }
zeroize = "1.8"
wasm-bindgen = { version = "=0.2.104", optional = true }
jni = { version = "=0.21.1", optional = true }

[dev-dependencies]
hex = "0.4"
serde_json = "1"
pakery-spake2 = { version = "=0.6.2", features = ["test-utils"] }
p256 = "=0.14.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
