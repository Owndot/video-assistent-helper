<!doctype html><html><head><title>Reel Schleife</title></head><body style="margin:0">
<video id=v muted playsinline style="width:100%;display:block"></video><p>x</p>
<script>
const v = document.getElementById('v');
let V, A, n = 0;
async function load() {   // wie Reels: für jeden Durchlauf eine NEUE MediaSource
  if (!V) { V = await (await fetch('/data/mse_v')).arrayBuffer(); A = await (await fetch('/data/mse_a')).arrayBuffer(); }
  const ms = new MediaSource(); const old = v.src; v.src = URL.createObjectURL(ms);
  await new Promise(r => ms.addEventListener('sourceopen', r, { once: true }));
  const sv = ms.addSourceBuffer('video/webm; codecs="vp8"'), sa = ms.addSourceBuffer('audio/webm; codecs="opus"');
  const add = (sb, b) => new Promise((r) => { sb.addEventListener('updateend', r, { once: true }); sb.appendBuffer(b); });
  await add(sv, V); await add(sa, A); try { ms.endOfStream(); } catch (e) {}
  v.play().catch(() => {});
}
v.addEventListener('ended', () => { n++; window.__loops = n; load(); });
load();
</script></body></html>
