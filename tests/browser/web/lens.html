<!doctype html><html><head><meta name=viewport content="width=device-width,initial-scale=1"></head>
<body style="margin:0;background:url(stripes.svg);background-size:40px 40px;height:100vh">
<div id=host></div>
<script src="/lens.js"></script>
<script>
const root = document.getElementById('host').attachShadow({mode:'closed'});
window.__r = root;
const NS='http://www.w3.org/2000/svg';
root.innerHTML = `<style>
.b{position:absolute;border-radius:999px;background:rgba(255,255,255,.06);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 24px rgba(0,0,0,.3)}
</style><svg width=0 height=0 style=position:absolute><defs></defs></svg>
<div class=b id=a style="left:30px;top:60px;width:160px;height:64px"></div>
<div class=b id=c style="left:220px;top:40px;width:100px;height:100px"></div>
<div class=b id=s style="left:40px;top:200px;width:60px;height:260px;border-radius:30px"></div>`;
const defs = root.querySelector('defs');
let n=0;
function lens(el, r, bezel, mag, scale, blur){
  const w = el.offsetWidth, h = el.offsetHeight, id='L'+(n++);
  const f = document.createElementNS(NS,'filter');
  f.setAttribute('id',id); f.setAttribute('x','0'); f.setAttribute('y','0'); f.setAttribute('width',w); f.setAttribute('height',h); f.setAttribute('filterUnits','userSpaceOnUse'); f.setAttribute('color-interpolation-filters','sRGB');
  f.innerHTML = `<feImage href="${lensMap(w,h,r,bezel,mag)}" x="0" y="0" width="${w}" height="${h}" result="m" preserveAspectRatio="none"/><feDisplacementMap in="SourceGraphic" in2="m" scale="${scale}" xChannelSelector="R" yChannelSelector="G"/>`;
  defs.appendChild(f);
  el.style.backdropFilter = `url(#${id}) blur(${blur}px) saturate(1.4)`;
}
lens(root.getElementById('a'), 32, 18, 0.06, 36, 1);
lens(root.getElementById('c'), 50, 22, 0.08, 40, 1);
lens(root.getElementById('s'), 30, 16, 0.04, 30, 1);
</script></body></html>
