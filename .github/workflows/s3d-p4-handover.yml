name: S3d P4 test app - handover of the UNSIGNED APK via job log (no key, no signature, no artifact)

# Übergabe der unsignierten, nicht installierbaren P4-Testapp (ee54864, versionCode 4, 1.0.4-p4test) an den Eigentümer
# zum Signieren auf seinem Gerät. Gebaut wie s3d-p4-unsigned.yml; nur wenn der SHA-256 genau dem viermal belegten Wert
# entspricht, wird die Datei als nummerierte Base64-Zeilen ins Joblog geschrieben. Kein Artefakt, kein Schlüssel.
on:
  push:
    branches: ['test/s3d-p4-unsigned']
    paths: ['.github/workflows/s3d-p4-handover.yml']

permissions:
  contents: read

env:
  NDK_VERSION: 27.2.12479018
  SRC_SHA: ee5486442266f2730893353ac71611809dfd21b1
  WANT_SHA256: 2667665f3bd5e6753a9ab2d0cedc9c9cf088d0bf0013fcad36979964419445b3

jobs:
  handover:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SRC_SHA }}
          path: src
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Exact source, pinned toolchains
        run: |
          set -euo pipefail
          test "$(git -C src rev-parse HEAD)" = "$SRC_SHA"
          grep -q '"status": "UNAPPROVED"' src/release/production-policy.json
          grep -qx '  "certificate_sha256": null,' src/release/p4test-signer.json
          (cd src/poc/pake-channel/core && rustup toolchain install && rustc -V)
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "platforms;android-37.0" "build-tools;36.0.0" "build-tools;34.0.0" < <(yes 2>/dev/null) > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Unsigned de.evp.helfer.p4test, versionCode 4 (not installable)
        working-directory: src
        run: |
          set -euo pipefail
          bash tools/build-channel-native.sh "$RUNNER_TEMP/a"
          GITHUB_RUN_NUMBER=4 bash tools/p4test/build-unsigned.sh "$RUNNER_TEMP/a" 4
          test -z "$(git status --porcelain)"
      - name: Exactly the approved unsigned APK, then the job log handover
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/a/p4/helper-p4test-unsigned.apk"; BT="$ANDROID_HOME/build-tools/34.0.0"
          got="$(sha256sum < "$APK" | cut -d' ' -f1)"
          [ "$got" = "$WANT_SHA256" ] || { echo "REFUSED: unsigned APK $got != approved $WANT_SHA256" >&2; exit 1; }
          if "$BT/apksigner" verify "$APK" >/dev/null 2>&1; then echo "REFUSED: signed" >&2; exit 1; fi
          "$BT/aapt2" dump badging "$APK" | head -1
          n="$(base64 -w 0 < "$APK" | fold -w 3000 | wc -l)"
          echo "APKB64-BEGIN name=helper-p4test-unsigned-4.apk size=$(stat -c %s "$APK") sha256=$got lines=$n"
          base64 -w 0 < "$APK" | fold -w 3000 | awk '{ printf "APKB64 %05d %s\n", NR, $0 }'
          echo "APKB64-END sha256=$got"
