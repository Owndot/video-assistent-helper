name: Disposable APK migration tests
on:
  workflow_dispatch:
  push:
    branches: [codex/security-phase-1]
    paths: ['tools/*migration*.sh', '.github/workflows/migration-tests.yml', 'app/build.gradle']
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: tools/build-migration-fixtures.sh
      - uses: actions/upload-artifact@v4
        with:
          name: migration-fixtures-TEST-ONLY
          path: migration-fixtures
          retention-days: 2
  emulator:
    needs: fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [26, 28, 31, 32, 33, 35, 37]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: migration-fixtures-TEST-ONLY
          path: migration-fixtures
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          disable-animations: true
          script: tools/test-migration-device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-results-api-${{ matrix.api }}
          path: '*-install.log'
          if-no-files-found: ignore
