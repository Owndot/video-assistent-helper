name: SDK probe (temporary branch, text only)
# NUR DIAGNOSE für Phase A (Zweig tmp/okhttp-size-test, nie mergen): Paketnamen, Versionen, Prüfsummen.
on:
  push:
    branches: [tmp/okhttp-size-test]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: SDK packages, AGP versions, Gradle checksums
        run: |
          set -uo pipefail
          sm="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sm" --version
          "$sm" --list 2>/dev/null | grep -E 'platforms;android-3[4-9]|build-tools;3[4-9]|system-images;android-3[4-7];google_apis;x86_64' | sort -u
          echo "== installed"; ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
          echo "== AGP versions (9.x)"; curl -fsSL https://dl.google.com/android/maven2/com/android/tools/build/gradle/maven-metadata.xml | grep -o '<version>9\.[0-9.]*</version>' | tr '\n' ' '; echo
          echo "== AGP 8.x latest"; curl -fsSL https://dl.google.com/android/maven2/com/android/tools/build/gradle/maven-metadata.xml | grep -o '<version>8\.1[0-9][0-9.]*</version>' | tail -5 | tr '\n' ' '; echo
          for v in 9.3.1 9.4.1 9.5.0; do echo "gradle-$v-bin.zip sha256: $(curl -fsSL https://services.gradle.org/distributions/gradle-$v-bin.zip.sha256)"; done
          echo "gradle-8.9 wrapper jar sha256: $(curl -fsSL https://services.gradle.org/distributions/gradle-8.9-wrapper.jar.sha256)"
          echo "gradle-9.3.1 wrapper jar sha256: $(curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-wrapper.jar.sha256)"
          java -version 2>&1 | head -1
