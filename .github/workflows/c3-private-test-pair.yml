    - name: Public test identity and encrypted transport (no private recipient key in CI)
      run: "set -euo pipefail\ncat > \"$RUNNER_TEMP/public-pair.json\" <<'C3_PUBLIC_EOF'\n{\n  \"existing_extension_id\": \"ladlndddhohknfpnfibchcadhgbpdlhm\",\n  \"test_extension_id\": \"fhjmppadldgkhdgkdplpalmoooocoinn\",\n  \"manifest_key\": \"\",\n  \"kadri_commit\": \"fb66e9138f27661532e2fe136c835afbcb37a489\",\n  \"helper_commit\": \"ca605408924644eeba6c29b4037dd90a324bb078\",\n  \"production_status\": \"UNAPPROVED\"\n}\nC3_PUBLIC_EOF\ncat > \"$RUNNER_TEMP/recipient-public.pem\" <<'C3_PUBLIC_EOF'\n-----BEGIN PUBLIC KEY-----\nMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAxPDe/SlFYaDLwnA+d24T\n4Rt65Pkw3n3+Vg9AfGgY9th24N73hrLAsDCXh+raCjiykm9ZiqL2RzLwGdQeL6X3\nQL5PolexHtIOHHlm5yzuGRgqpvoeLEWAZHfgtX9JgV/K/KNaAKIpWqXK3dEmnccn\n8Xe/AmXYpmuSHGG7WGRnqKugCGVByDpq28asUe3G5pZ2sVrphPpZpV7OLdejT8VE\nYm/qWyi6h20eDy+ThM17PbTPLtF2GffALzXloV5Sbi0Ku9i6MXP5wjyN8BHx50d3\no9fNHUvFv5uB60onZcbo1caYwZIOuP4ItB8aR6t3KIdCjj5rGFGDP+mUNbXWTlCL\nnUl5nriSd6V/alLIdKAlc9C2V6D8teVoPnx0mZ9+epUE8lVcZwdpGfwn6XMTR2l2\nK8esgF3omlsX3mlOSUFFF2Ko2D85pdGaWL+L5T/g4d02t29oUoRxkLjxmlJoLwkd\ntdO6/+7F1e42cqjvcFXrtiBLq25DsUVvZK/xVTc8srODAgMBAAE=\n-----END PUBLIC KEY-----\nC3_PUBLIC_EOF\ncat > \"$RUNNER_TEMP/pack_extension.py\" <<'C3_PUBLIC_EOF'\nimport base64\nimport hashlib\nimport json\nimport sys\nimport zipfile\nfrom pathlib import Path\n\nroot, output, config_path = map(Path, sys.argv[1:])\nconfig = json.loads(config_path.read_text())\npublic = base64.b64decode(config['manifest_key'], validate=True)\nextension_id = hashlib.sha256(public).hexdigest()[:32].translate(str.maketrans('0123456789abcdef', 'abcdefghijklmnop'))\nassert extension_id == config['test_extension_id']\nassert extension_id != config['existing_extension_id']\nbase = json.loads((root/'manifest.json').read_text())\nassert not any(k in base for k in ['key', 'update_url', 'externally_connectable'])\nassert base['permissions'] == ['storage', 'declarativeNetRequestWithHostAccess', 'scripting']\nassert base['content_security_policy']['extension_pages'] == \"script-src 'self' 'wasm-unsafe-eval'; object-src 'self';\"\nmanifest = dict(base, name='Kadri C3 TEST', description='Isoliertes C3-Testpaar fb66e91 / ca60540. UNAPPROVED.', key=config['manifest_key'])\nassert {k for k in set(base)|set(manifest) if base.get(k) != manifest.get(k)} == {'name', 'description', 'key'}\nentries = sorted(p for p in root.rglob('*') if p.is_file())\nassert entries and all(not p.is_symlink() for p in entries)\nwith zipfile.ZipFile(output, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:\n    for p in entries:\n        name = p.relative_to(root).as_posix()\n        content = (json.dumps(manifest, indent=2, ensure_ascii=False)+'\\n').encode() if name == 'manifest.json' else p.read_bytes()\n        info = zipfile.ZipInfo(name, date_time=(1980,1,1,0,0,0))\n        info.external_attr = 0o644 << 16\n        info.compress_type = zipfile.ZIP_DEFLATED\n        z.writestr(info, content)\nwith zipfile.ZipFile(output) as z:\n    assert z.namelist() == [p.relative_to(root).as_posix() for p in entries]\n    for p in entries:\n        name = p.relative_to(root).as_posix()\n        if name != 'manifest.json':\n            assert z.read(name) == p.read_bytes(), name\nprint('PASS: only test name, description and fixed public key differ; extension ID', extension_id)\nC3_PUBLIC_EOF\ncat > \"$RUNNER_TEMP/encrypt.py\" <<'C3_PUBLIC_EOF'\n\"\"\"Only ciphertext leaves the public runner. Recipient private key never enters CI.\"\"\"\nimport base64\nimport io\nimport json\nimport os\nimport sys\nimport zipfile\nfrom pathlib import Path\nfrom cryptography.hazmat.primitives import hashes, serialization\nfrom cryptography.hazmat.primitives.asymmetric import padding\nfrom cryptography.hazmat.primitives.ciphers.aead import AESGCM\n\nsource, recipient, destination = map(Path, sys.argv[1:])\nassert destination.suffix == '.enc'\nfiles = sorted(p for p in source.rglob('*') if p.is_file())\nassert files and all(not p.is_symlink() for p in files)\nassert all(p.suffix in {'.apk', '.zip', '.json', '.txt'} or p.name == 'SHA256SUMS' for p in files)\nassert not any('androidTest' in p.name or 'private' in p.name.lower() for p in files)\nbuffer = io.BytesIO()\nwith zipfile.ZipFile(buffer, 'w', zipfile.ZIP_DEFLATED) as z:\n    for p in files: z.write(p, p.relative_to(source).as_posix())\nkey, nonce = AESGCM.generate_key(bit_length=256), os.urandom(12)\naad = b'C3 private test pair | fb66e9138f27661532e2fe136c835afbcb37a489 | ca605408924644eeba6c29b4037dd90a324bb078 | UNAPPROVED | v1'\npublic = serialization.load_pem_public_key(recipient.read_bytes())\nassert public.key_size >= 3072\nwrapped = public.encrypt(key, padding.OAEP(mgf=padding.MGF1(hashes.SHA256()), algorithm=hashes.SHA256(), label=None))\nciphertext = AESGCM(key).encrypt(nonce, buffer.getvalue(), aad)\nenvelope = {'version':1, 'algorithm':'RSA-OAEP-SHA256+AES-256-GCM', **{k:base64.b64encode(v).decode() for k,v in {'wrapped_key':wrapped, 'nonce':nonce, 'aad':aad, 'ciphertext':ciphertext}.items()}}\ndestination.parent.mkdir(parents=True, exist_ok=True)\ndestination.write_text(json.dumps(envelope))\nassert destination.stat().st_size < 31*1024*1024\nprint('PASS: encrypted delivery archive created; plaintext and private signing keys are not uploaded')\nC3_PUBLIC_EOF\ncat > \"$RUNNER_TEMP/isolation.cjs\" <<'C3_PUBLIC_EOF'\nconst {chromium}=require('playwright');\nconst fs=require('fs'), path=require('path'), os=require('os'), assert=require('assert/strict');\nconst [pack,control,expected,existing]=process.argv.slice(2);\nconst tmp=fs.mkdtempSync(path.join(os.tmpdir(),'c3-identity-'));\nasync function launch(paths, profile) {\n  return chromium.launchPersistentContext(profile,{headless:false,args:[`--disable-extensions-except=${paths.join(',')}`,`--load-extension=${paths.join(',')}`]});\n}\nasync function workers(ctx,n){\n  for(let i=0;i<150;i++) {\n    const w=ctx.serviceWorkers();\n    if(w.length===n) return w;\n    await new Promise(r=>setTimeout(r,100));\n  }\n  throw Error('extension workers missing');\n}\nasync function idb(w,write,value){return w.evaluate(async({write,value})=>{\n  const db=await new Promise((resolve,reject)=>{const r=indexedDB.open('c3-isolation-probe',1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});\n  try {return await new Promise((resolve,reject)=>{const tx=db.transaction('s',write?'readwrite':'readonly');const r=write?tx.objectStore('s').put(value,'marker'):tx.objectStore('s').get('marker');let result;r.onsuccess=()=>{result=r.result;};tx.oncomplete=()=>resolve(result);tx.onerror=()=>reject(tx.error);});}finally{db.close();}\n},{write,value});}\n(async()=>{\n  assert.notEqual(expected,existing);\n  let ctx=await launch([pack,control],path.join(tmp,'profile1'));\n  try{\n    const ws=await workers(ctx,2);\n    const test=ws.find(w=>new URL(w.url()).host===expected);\n    const other=ws.find(w=>new URL(w.url()).host!==expected);\n    assert.ok(test&&other,'two distinct extension IDs');\n    assert.equal(await test.evaluate(()=>chrome.runtime.id),expected);\n    await test.evaluate(()=>chrome.storage.local.set({'c3-isolation-probe':'test'}));\n    assert.deepEqual(await other.evaluate(()=>chrome.storage.local.get('c3-isolation-probe')),{});\n    await other.evaluate(()=>chrome.storage.local.set({'c3-isolation-probe':'control'}));\n    assert.equal((await test.evaluate(()=>chrome.storage.local.get('c3-isolation-probe')))['c3-isolation-probe'],'test');\n    await idb(test,true,'test');\n    assert.equal(await idb(other,false),undefined);\n    await idb(other,true,'control');\n    assert.equal(await idb(test,false),'test');\n    console.log('PASS: two extensions, separate storage.local and IndexedDB; no existing installation used');\n  }finally{await ctx.close();}\n  const relocated=path.join(tmp,'different-path');fs.cpSync(pack,relocated,{recursive:true});\n  ctx=await launch([relocated],path.join(tmp,'profile2'));\n  try{const [w]=await workers(ctx,1);assert.equal(new URL(w.url()).host,expected);console.log('PASS: same test ID after relocation and fresh browser profile');}\n  finally{await ctx.close();}\n})().catch(e=>{console.error(e);process.exitCode=1;}).finally(()=>fs.rmSync(tmp,{recursive:true,force:true}));\nC3_PUBLIC_EOF\n"
    - name: Independent test packaging from two build paths; production gates unchanged
