        z=p/''kadri-c3-fb66e91-vivaldi-test.zip''

        meta=dict(json.loads((p/''pair.json'').read_text()),zip_sha256=hashlib.sha256(z.read_bytes()).hexdigest(),workflow_run=os.environ[''GITHUB_RUN_ID''],identity_and_storage_check=''PASS: packaged extension with separate control extension, two installation paths'',packaging_differences=[''manifest.name'',''manifest.description'',''manifest.key''])

        (p/''build-evidence.json'').write_text(json.dumps(meta,indent=2)+''\n'')

        (p/''SHA256SUMS'').write_text(hashlib.sha256(z.read_bytes()).hexdigest()+''  ''+z.name+''\n'')

        PY

        python3 "$RUNNER_TEMP/encrypt.py" "$RUNNER_TEMP/deliver-kadri" "$RUNNER_TEMP/recipient-public.pem" "$RUNNER_TEMP/encrypted/kadri.enc"

