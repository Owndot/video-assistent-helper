name: OkHttp size test (temporary branch, text report only)

# NUR GRÖSSENTEST für Entscheidung D1 (Zweig tmp/okhttp-size-test, nie mergen, danach löschen).
# Baut die Testvariante de.evp.helfer.channeltest in sechs Varianten (ohne OkHttp, OkHttp 5.3.2, OkHttp 5.5.1; je ohne/mit R8), misst
# APK- und installierte Größe auf einem Wegwerf-Emulator, prüft Reproduzierbarkeit und führt die 15 Kanal-
# Instrumentierungstests gegen jede Variante aus. Keine Download-Funktion; die Probe-Klasse wird nie aufgerufen.
# Es wird NIE eine APK hochgeladen: das Artefakt enthält nur Text (Größen, Hashes, Abhängigkeiten, Testergebnisse).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: okhttp-size-test
  cancel-in-progress: true

env:
  NDK_VERSION: 27.2.12479018

jobs:
  size:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Production policy stays UNAPPROVED
        run: |
          grep -q '"status": "UNAPPROVED"' release/production-policy.json
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Pinned toolchains (Rust from rust-toolchain.toml, NDK r27c, SDK 34, build-tools 34.0.0)
        run: |
          set -euo pipefail
          (cd poc/pake-channel/core && rustup show active-toolchain && rustc -V)
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "platforms;android-34" "build-tools;34.0.0" < <(yes 2>/dev/null) > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Native channel library (once, shared by all variants)
        run: bash tools/build-channel-native.sh "$RUNNER_TEMP/native"
      - name: Build six variants (base, r8, ok532, ok532r8, ok551, ok551r8)
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/v"; mkdir -p "$R/text"
          build() {  # $1 variant, $2 source root, $3 out dir, rest: gradle args
            local v="$1" src="$2" out="$3"; shift 3
            mkdir -p "$out"; cp -r "$RUNNER_TEMP/native/jniLibs" "$RUNNER_TEMP/native/jniLibs-test" "$out/"
            rm -rf "$src/app/build"
            echo "::group::build $v ($out)"
            (cd "$src" && CHANNEL_SIZE_ARGS="$*" bash tools/build-channel-apk.sh "$out") 2>&1 | tee "$R/text/build-$v.log"
            echo "::endgroup::"
          }
          build base     "$GITHUB_WORKSPACE" "$R/base"
          build r8       "$GITHUB_WORKSPACE" "$R/r8"       -PsizeR8
          # 5.3.2: neueste Version, die mit compileSdk 34 / AGP 8.5.2 baut (5.4.0 verlangt 36, 5.5.x verlangt 37).
          build ok532    "$GITHUB_WORKSPACE" "$R/ok532"    -PsizeOkhttp=5.3.2
          build ok532r8  "$GITHUB_WORKSPACE" "$R/ok532r8"  -PsizeOkhttp=5.3.2 -PsizeR8
          # Gleiche R8-Konfiguration + Kotlin/AndroidX behalten: nur damit der Testrunner gegen die R8-APK laufen kann.
          build ok532r8t "$GITHUB_WORKSPACE" "$R/ok532r8t" -PsizeOkhttp=5.3.2 -PsizeR8 -PsizeR8Instrumented
          # 5.5.1 (aktuell): NUR Größenmessung, AAR-Prüfung abgeschaltet; mit diesem Toolchain nicht auslieferbar.
          #        Ein Fehlschlag hier wird berichtet, bricht den Lauf aber nicht ab.
          build ok551    "$GITHUB_WORKSPACE" "$R/ok551"    -PsizeOkhttp=5.5.1 -PsizeSkipAarCheck || echo "BUILD FAILED ok551" | tee -a "$R/text/build-failures.txt"
          build ok551r8  "$GITHUB_WORKSPACE" "$R/ok551r8"  -PsizeOkhttp=5.5.1 -PsizeSkipAarCheck -PsizeR8 || echo "BUILD FAILED ok551r8" | tee -a "$R/text/build-failures.txt"
          # Reproduzierbarkeit: baubare OkHttp-Varianten ein zweites Mal aus einer Kopie in einem anderen Pfad.
          mkdir -p "$RUNNER_TEMP/src-b" && git archive HEAD | tar -x -C "$RUNNER_TEMP/src-b"
          build ok532-b   "$RUNNER_TEMP/src-b" "$R/ok532-b"   -PsizeOkhttp=5.3.2
          build ok532r8-b "$RUNNER_TEMP/src-b" "$R/ok532r8-b" -PsizeOkhttp=5.3.2 -PsizeR8
      - name: Reproducibility (all entries except META-INF signature files byte-identical)
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/v"
          entries() { python3 -c '
          import hashlib, sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          for n in sorted(z.namelist()):
              if n.startswith("META-INF/") and n.split("/")[-1].split(".")[-1] in ("SF", "RSA", "MF"): continue
              if n == "META-INF/version-control-info.textproto": continue   # AGP: Git-Stand (B stammt aus git archive)
              print(hashlib.sha256(z.read(n)).hexdigest(), n)' "$1"; }
          for v in ok532 ok532r8; do
            for apk in helper-channeltest.apk helper-channeltest-androidTest.apk; do
              entries "$R/$v/apk/$apk" > "$R/$v.$apk.e"; entries "$R/$v-b/apk/$apk" > "$R/$v-b.$apk.e"
              diff "$R/$v.$apk.e" "$R/$v-b.$apk.e"
              unzip -p "$R/$v/apk/$apk" META-INF/version-control-info.textproto 2>/dev/null | head -5 | sed "s/^/  $v A vcs: /" || true
              unzip -p "$R/$v-b/apk/$apk" META-INF/version-control-info.textproto 2>/dev/null | head -5 | sed "s/^/  $v B vcs: /" || true
              echo "REPRODUCIBLE $v $apk: $(wc -l < "$R/$v.$apk.e") entries byte-identical" | tee -a "$R/text/reproducibility.txt"
            done
          done
      - name: Size report, manifest difference, resolved dependencies
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/v"; BT="$ANDROID_HOME/build-tools/34.0.0"
          python3 tools/size-report.py $(for v in base r8 ok532 ok532r8 ok532r8t ok551 ok551r8; do [ -f "$R/$v/apk/helper-channeltest.apk" ] && printf '%s=%s ' $v "$R/$v/apk/helper-channeltest.apk"; done) | tee "$R/text/size-report.txt"
          for v in base r8 ok532 ok532r8 ok532r8t ok551 ok551r8; do
            [ -f "$R/$v/apk/helper-channeltest.apk" ] || continue
            echo "$v $(sha256sum < "$R/$v/apk/helper-channeltest.apk" | cut -c1-64) $(wc -c < "$R/$v/apk/helper-channeltest.apk")" >> "$R/text/apk-hashes.txt"
            "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$R/$v/apk/helper-channeltest.apk" > "$R/text/manifest-$v.txt"
            "$BT/aapt2" dump permissions "$R/$v/apk/helper-channeltest.apk" > "$R/text/permissions-$v.txt"
          done
          echo "== merged manifest: base -> ok532"; diff "$R/text/manifest-base.txt" "$R/text/manifest-ok532.txt" | tee "$R/text/manifest-diff.txt" || true
          echo "== permissions: base -> ok532"; diff "$R/text/permissions-base.txt" "$R/text/permissions-ok532.txt" | tee "$R/text/permissions-diff.txt" || true
          poc/android-capability/app-project/gradlew --no-daemon -q -p . :app:dependencies --configuration channeltestRuntimeClasspath \
            -PsizeOkhttp=5.3.2 -PchannelTests -Pandroid.useAndroidX=true | tee "$R/text/dependencies-5.3.2.txt"
          poc/android-capability/app-project/gradlew --no-daemon -q -p . :app:dependencies --configuration channeltestRuntimeClasspath \
            -PsizeOkhttp=5.5.1 -PchannelTests -Pandroid.useAndroidX=true | tee "$R/text/dependencies-5.5.1.txt"
          find ~/.gradle/caches/modules-2/files-2.1 \( -path '*com.squareup.okhttp3*' -o -path '*com.squareup.okio*' -o -path '*org.jetbrains.kotlin/kotlin-stdlib*' \
            -o -path '*org.jetbrains/annotations*' -o -path '*androidx.startup*' -o -path '*androidx.annotation*' -o -path '*androidx.tracing*' \) \
            \( -name '*.jar' -o -name '*.aar' \) ! -name '*sources*' -exec sha256sum {} + | sed "s|$HOME/.gradle/caches/modules-2/files-2.1/||" | sort -k2 \
            | tee "$R/text/dependency-sha256.txt"
          grep -hiE 'warning|R8:' "$R"/text/build-*.log | sort | uniq -c | head -40 || true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Installed size and channel instrumentation per variant (disposable API 34 emulator)
        timeout-minutes: 45
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash tools/size-emulator.sh "$RUNNER_TEMP/v" base r8 ok532 ok532r8 ok532r8t ok551 ok551r8 < /dev/null > /dev/null 2>&1
      - name: Collect text report (never an APK)
        if: always()
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/v"; mkdir -p "$R/text"
          cp "$R/installed.txt" "$R/text/" 2>/dev/null || true
          for v in base r8 ok532 ok532r8 ok532r8t ok551 ok551r8; do [ -f "$R/$v/report/summary.txt" ] && cp "$R/$v/report/summary.txt" "$R/text/instrumentation-$v.txt" || true; done
          cat "$R/text/emulator.txt" 2>/dev/null || true
          cat "$R/text/installed.txt" 2>/dev/null || true
          if find "$R/text" -type f \( -name '*.apk' -o -name '*.aab' -o -name '*.so' -o -name '*.dex' -o -name '*.zip' \) | grep -q .; then echo "installable file in report" >&2; exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: okhttp-size-test-report-text-only
          path: ${{ runner.temp }}/v/text
          retention-days: 7
