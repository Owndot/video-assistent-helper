name: Helper stable baseline observations
on:
  workflow_dispatch:
  # Optional emulator measurements run deliberately; ordinary PR updates do not start another emulator.
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Build source comparison with debug signing only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p validation-results "$RUNNER_TEMP/helper-stable"
          python3 .github/scripts/fetch-helper-baseline.py "$RUNNER_TEMP/helper-stable"
          # Fetch only sources and root build configuration: never retrieve the historical signing material.
          cp app/build.gradle "$RUNNER_TEMP/helper-stable/app/build.gradle"
          (cd "$RUNNER_TEMP/helper-stable" && gradle :app:assembleDebug --no-daemon)
          cp "$RUNNER_TEMP/helper-stable/app/build/outputs/apk/debug/app-debug.apk" validation-results/stable.apk
          gradle :app:assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk validation-results/current.apk
          tests/java/build.sh
          mkdir -p "$RUNNER_TEMP/network-probe"
          javac -cp tests/java/classes -d "$RUNNER_TEMP/network-probe" .github/probes/NetworkCookieProbe.java
          jar cf "$RUNNER_TEMP/network-probe.jar" -C "$RUNNER_TEMP/network-probe" .
          jar cf "$RUNNER_TEMP/core-classpath.jar" -C tests/java/classes .
          d8=$(find "$ANDROID_HOME/build-tools" -name d8 -type f | sort -V | tail -1)
          "$d8" --min-api 26 --lib "$ANDROID_HOME/platforms/android-34/android.jar" --classpath "$RUNNER_TEMP/core-classpath.jar" --output validation-results/network-probe.zip "$RUNNER_TEMP/network-probe.jar"
          git rev-parse HEAD > validation-results/current-commit.txt
          echo b05fd2de60d27d368eda60ff32be8b361a695f45 > validation-results/stable-source.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: default
          disable-animations: true
          script: bash .github/scripts/run-helper-observations.sh
      - name: Check actual Android HTTP cookie policy
        run: |
          python3 - <<'PY'
          import json
          old=json.load(open("validation-results/stable-native-cookie.json"))
          new=json.load(open("validation-results/current-native-cookie.json"))
          assert old["tenantCookieAllowed"], "Baseline did not reproduce tenant leak"
          assert not new["tenantCookieAllowed"] and not new["crossCookiePresent"]
          assert new["sameCookiePreserved"] and new["rangePreserved"] and new["pslReady"]
          print("PASS: Android runtime tenant isolation, redirect credentials, Range and packaged PSL")
          print("Previous Android native redirect forwarded cookie:",old["crossCookiePresent"])
          assert old["redirect300Followed"] and new["redirect300Followed"]
          print("PASS: native Android HTTP300 compatibility retained")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: helper-emulator-baseline-observations
          path: |
            validation-results/*.jsonl
            validation-results/*-native-cookie.json
            validation-results/*.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: helper-baseline-APKs-TEST-ONLY
          path: validation-results/*.apk
          retention-days: 2
