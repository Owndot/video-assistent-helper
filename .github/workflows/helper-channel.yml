name: Helper secure channel (test package only, nothing published)

# Steuerkanal der Helper-App (SPAKE2-Kopplung, Noise KK, Rust-Kern über JNI). Baut ausschließlich die Testvariante
# de.evp.helfer.channeltest mit einem Wegwerf-Signierer, installiert sie auf einem Wegwerf-Emulator und
# deinstalliert sie im selben Job. Keine APK verlässt den Job (das Repository ist öffentlich; ein Artefakt wäre
# eine Veröffentlichung) – nur Text-Berichte und Hashes.
on:
  pull_request:
    paths: ['poc/p4a-hls/tools/**', 'app/**', 'poc/pake-channel/**', 'tests/java/**', 'tools/build-channel-*.sh', 'tools/run-channel-*.sh', 'tools/run-flaky-repeat.sh', 'tools/wait-device-ready.sh', 'tools/check-network-layer.sh', 'tools/p4test/**', 'release/p4test-signer.json', 'gradle/**', '.github/workflows/helper-channel.yml']
  push:
    branches: [feature/helper-channel-control]
    paths: ['poc/p4a-hls/tools/**', 'app/**', 'poc/pake-channel/**', 'tests/java/**', 'tools/build-channel-*.sh', 'tools/run-channel-*.sh', 'tools/run-flaky-repeat.sh', 'tools/wait-device-ready.sh', 'tools/check-network-layer.sh', 'tools/p4test/**', 'release/p4test-signer.json', 'gradle/**', '.github/workflows/helper-channel.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helper-channel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p4-signing-macos:
    # P4c-Vorbereitung: der Signierweg läuft beim Eigentümer auf einem Mac. Hier mit den macOS-eigenen Werkzeugen
    # (/bin/bash 3.2, LibreSSL, BSD sed/grep, kein sha256sum, kein Homebrew im PATH) und einem synthetischen, codefreien
    # Paket; Wegwerfschlüssel, alles wird gelöscht, nichts hochgeladen.
    name: P4 signing path on macOS (stock tools, throwaway key, nothing published)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android build-tools 34.0.0 and platform android-34
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-$HOME/Library/Android/sdk}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          ls "$sdk/cmdline-tools/latest/bin/sdkmanager"
          # Wie im Linux-Job: yes über Prozessersetzung (eine Pipe endete mit SIGPIPE und pipefail)
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;34.0.0" "platforms;android-34" < <(yes 2>/dev/null) > "$RUNNER_TEMP/sdkmanager.log" || { tail -20 "$RUNNER_TEMP/sdkmanager.log"; exit 1; }
          test -x "$sdk/build-tools/34.0.0/apksigner"
      - name: Self-test with stock macOS tools only
        run: |
          set -euo pipefail
          export PATH="/usr/bin:/bin:/usr/sbin:/sbin:$JAVA_HOME/bin"
          /bin/bash --version | head -1
          /usr/bin/openssl version
          sw_vers -productVersion
          /bin/bash tools/p4test/synthetic-apk.sh "$RUNNER_TEMP/p4.apk" de.evp.helfer.p4test "P4 TEST Helfer"
          /bin/bash tools/p4test/synthetic-apk.sh "$RUNNER_TEMP/other.apk" de.evp.helfer.channeltest "TEST Helper-Kanal"
          # 1) Bordmittel wie auf einem aktuellen Mac (macOS 15 bringt /sbin/sha256sum mit)
          /bin/bash tools/p4test/selftest.sh "$RUNNER_TEMP/p4.apk" "$RUNNER_TEMP/other.apk"
          # 2) wie auf älteren Macs ohne sha256sum: Rückfall auf shasum
          PATH="/usr/bin:/bin:$JAVA_HOME/bin"
          if command -v sha256sum; then echo "sha256sum still on PATH: fallback not exercised" >&2; exit 1; fi
          /bin/bash tools/p4test/selftest.sh "$RUNNER_TEMP/p4.apk" "$RUNNER_TEMP/other.apk"
          rm -f "$RUNNER_TEMP/p4.apk" "$RUNNER_TEMP/other.apk"
  jvm:
    name: Core, JVM channel checks, mutation probes, WASM unchanged
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Toolchains (Rust 1.97.0 from rust-toolchain.toml, wasm-bindgen-cli 0.2.104)
        run: |
          set -euo pipefail
          (cd poc/pake-channel/core && rustup show active-toolchain && rustc -V)
          cargo install wasm-bindgen-cli --version 0.2.104 --locked
      - name: Core tests (unchanged protocol, existing revocation)
        run: cd poc/pake-channel/core && cargo test --locked
      - name: Channel checks against the real ChannelServer/ControlCommands and the Rust core (JNI)
        run: bash tests/java/channel/run.sh "$RUNNER_TEMP/desk"
      - name: Mutation probes (each weakened copy must fail the checks)
        run: python3 -I tests/java/channel/mutation.py "$RUNNER_TEMP/desk"
      - name: Reviewed JVM checks (F1, F3, F4) against the app copies of SnapshotWriter and HttpRequestReader
        run: |
          set -euo pipefail
          copy="$RUNNER_TEMP/jvmchecks"; mkdir -p "$copy"
          for f in SnapshotWriter HttpRequestReader; do
            sed 's/^package de\.evp\.helfer;$/package de.evp.pakepoc;/' "app/src/main/java/de/evp/helfer/$f.java" > "$copy/$f.java"
            grep -q '^package de.evp.pakepoc;$' "$copy/$f.java"
          done
          bash poc/android-capability/tools/run-jvm-checks.sh "$copy"
      - name: Network layer guard (OkHttp only via de.evp.helfer.net; no unhardened client; no test hooks in production)
        run: |
          set -euo pipefail
          bash tools/check-network-layer.sh
          bash tools/check-network-layer.sh --self-test
      - name: Secure network layer - negative and functional tests (JVM, real sockets, 48 MiB heap)
        run: bash tests/java/net/run.sh "$RUNNER_TEMP/safe-http-deps"
      - name: Secure network layer - mutation probes (each weakened copy must fail the tests)
        run: python3 -I tests/java/net/mutation.py "$RUNNER_TEMP/safe-http-deps"
      - name: Direct MP4 downloads (C2) - engine tests against real local servers (JVM, 48 MiB heap, 512 MiB file)
        run: bash tests/java/dl/run.sh "$RUNNER_TEMP/safe-http-deps"
      - name: Direct MP4 downloads (C2) - mutation probes (each weakened copy must fail the tests)
        run: python3 -I tests/java/dl/mutation.py "$RUNNER_TEMP/safe-http-deps"
      - name: Kadri's vendored WASM is byte-identical (the JNI binding does not change the browser side)
        run: |
          set -euo pipefail
          bash poc/android-capability/tools/build-wasm-kadri.sh "$RUNNER_TEMP/wasm" | tee "$RUNNER_TEMP/wasm.txt"
          grep -q '^bda8018d18c08ae01b4a935e5761f1ce7d13e67928636ce3e3f7261451bde874  kadri_pairing_poc.js$' "$RUNNER_TEMP/wasm.txt"
          grep -q '^d84e09bbfd365f69f50de99491705ba80a8ee85174dad220c6f5ed94c8fb79a4  kadri_pairing_poc_bg.wasm$' "$RUNNER_TEMP/wasm.txt"

  emulator:
    name: Test package de.evp.helfer.channeltest on a disposable API ${{ matrix.api }} emulator
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # 34 = targetSdk; 26 = minSdk (älterer TLS-/Socket-Pfad von OkHttp: AndroidPlatform statt Android10Platform)
        # 29 (P4b): erste Stufe mit MediaStore.Downloads und Opus-Ausgabe; Heap-Messung für das HLS-Sample-Budget
        # 37.0 (Android 17) wurde in der P4c-Vorbereitung sechsmal versucht und wieder entfernt: das Emulator-Abbild
        # stürzt auf den Runnern ab, bevor ein Test läuft (surfaceflinger: Assertion hasReadColorBufferDma der
        # GPU-Emulation; mit -gpu guest GL-Kontextfehler; danach "Broken pipe" des Paketdienstes beim Installieren).
        # Kein App-Befund; Android 17 wird auf dem Testgerät geprüft (P4C-VORBEREITUNG.md). Die API-37-Einstellungen
        # unten bleiben für einen späteren Versuch mit einem neueren Abbild.
        api: [34, 29, 26]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Pinned toolchains (Rust from rust-toolchain.toml, NDK r27c, SDK 37.0, build-tools 36.0.0 + 34.0.0)
        run: |
          set -euo pipefail
          (cd poc/pake-channel/core && rustup show active-toolchain && rustc -V)
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" "platforms;android-37.0" "build-tools;36.0.0" "build-tools;34.0.0" < <(yes 2>/dev/null) > /dev/null
          test -f "$ANDROID_HOME/ndk/27.2.12479018/source.properties"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Native channel libraries (API 26 linker, arm64-v8a + x86_64)
        # pipefail: ein Fehler im Skript darf nicht hinter tee verschwinden.
        run: set -o pipefail; bash tools/build-channel-native.sh "$RUNNER_TEMP/a" | tee "$RUNNER_TEMP/native.txt"
      - name: Synthetic HLS fixtures for the device tests (own content, ffmpeg; test APK assets only)
        run: |
          set -euo pipefail
          for source in /etc/apt/apt-mirrors.txt /etc/apt/apt-mirrors-security.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$source" ]; then sudo sed -Ei 's#https?://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' "$source"; fi
          done
          timeout 120 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
          timeout 300 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends ffmpeg
          bash poc/p4a-hls/tools/make-fixtures.sh "$RUNNER_TEMP/hlsfx"
          echo "HLS_FIXTURES=$RUNNER_TEMP/hlsfx" >> "$GITHUB_ENV"
      - name: Test APKs with a throwaway signer (deleted after the build)
        # pipefail: ein Fehler im Skript darf nicht hinter tee verschwinden.
        run: set -o pipefail; bash tools/build-channel-apk.sh "$RUNNER_TEMP/a" | tee "$RUNNER_TEMP/apk.txt"
      - name: Only the test variant was built (no release or debug APK of de.evp.helfer)
        run: |
          set -euo pipefail
          ls app/build/outputs/apk
          test ! -e app/build/outputs/apk/release
          test ! -e app/build/outputs/apk/debug
      - name: P4 test app de.evp.helfer.p4test - unsigned build and fail-closed signing self-test (throwaway key; everything deleted)
        if: matrix.api == 34
        run: |
          set -euo pipefail
          bash tools/p4test/build-unsigned.sh "$RUNNER_TEMP/a" "$GITHUB_RUN_NUMBER"
          bash tools/p4test/selftest.sh "$RUNNER_TEMP/a/p4/helper-p4test-unsigned.apk" "$RUNNER_TEMP/a/apk/helper-channeltest.apk"
          rm -rf "$RUNNER_TEMP/a/p4" app/build/outputs/apk/p4test
          test ! -e app/build/outputs/apk/release && test ! -e app/build/outputs/apk/debug
      - name: Publication regression - build the previous failing cleanup in a disposable test variant
        run: |
          set -euo pipefail
          SRC=app/src/main/java/de/evp/helfer/Mp4Downloads.java
          cp "$SRC" "$RUNNER_TEMP/Mp4Downloads.fixed.java"
          trap 'cp "$RUNNER_TEMP/Mp4Downloads.fixed.java" "$SRC"' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/de/evp/helfer/Mp4Downloads.java')
          s=p.read_text()
          assert s.count('            cleanupPublishedProof(proof);') == 2
          p.write_text(s.replace('            cleanupPublishedProof(proof);', '            Downloads.removeProof(proof);'))
          PY
          mkdir -p "$RUNNER_TEMP/publication-mutant"
          cp -r "$RUNNER_TEMP/a/jniLibs" "$RUNNER_TEMP/a/jniLibs-test" "$RUNNER_TEMP/publication-mutant/"
          bash tools/build-channel-apk.sh "$RUNNER_TEMP/publication-mutant"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumentation on a disposable API ${{ matrix.api }} x86_64 emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          # API 37 bootete im Standardlimit (600 s) nicht fertig: mehr Zeit und Arbeitsspeicher (4 Kerne meldeten Boot vor
          # den Systemdiensten settings/input und wurden wieder entfernt)
          emulator-boot-timeout: 1200
          ram-size: ${{ matrix.api == '37.0' && '4096M' || '' }}
          # API 37: Standard-Datenpartition zu klein für Test-APKs + 64-MiB-Downloads ("not enough space")
          disk-size: ${{ matrix.api == '37.0' && '8G' || '' }}
          disable-animations: true
          # API 37: surfaceflinger stürzte mit swiftshader_indirect ab (Assertion hasReadColorBufferDma der Host-GPU-
          # Emulation, riss system_server mit) – dort Rendering im Gast
          emulator-options: -no-window -gpu ${{ matrix.api == '37.0' && 'guest' || 'swiftshader_indirect' }} -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash tools/wait-device-ready.sh && bash tools/run-channel-publication-regression.sh "$RUNNER_TEMP/publication-mutant" && bash tools/run-channel-instrumentation.sh "$RUNNER_TEMP/a" && bash tools/run-flaky-repeat.sh "$RUNNER_TEMP/a" 20
      - name: Collect text-only report (no APK, no keys)
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP"/native.txt "$RUNNER_TEMP"/apk.txt "$RUNNER_TEMP/out/" 2>/dev/null || true
          cp -r "$RUNNER_TEMP/a/report" "$RUNNER_TEMP/out/" 2>/dev/null || true
          find "$RUNNER_TEMP/out" \( -name '*.apk' -o -name '*.so' -o -name '*.p12' -o -name '*.jks' \) -delete
          ls -R "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: helper-channel-report-text-only-api${{ matrix.api }}
          path: ${{ runner.temp }}/out
          retention-days: 7
          if-no-files-found: warn
