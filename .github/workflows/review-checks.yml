name: Review checks PR 23/24 (temporary branch, text only)
# NUR REVIEW-PRÜFUNG (Zweig tmp/okhttp-size-test, nie mergen):
#  1. Aufrufziele (invoke-*) im dex vor/nach compileSdk 37 (neue Überladungen aus API 35-37?)
#  2. Lint NewApi gegen minSdk 26 auf dem Phase-A-Stand
#  3. classes.dex der Testvariante vs. Release-APK (PR 24): gleiche R8-Ausgabe?
on:
  push:
    branches: [tmp/okhttp-size-test]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Toolchains and worktrees
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" "platforms;android-34" "platforms;android-37.0" "build-tools;34.0.0" "build-tools;36.0.0" < <(yes 2>/dev/null) > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          git fetch -q origin feature/build-agp9-compilesdk37 feature/okhttp-r8
          git worktree add -q "$RUNNER_TEMP/old" c1926176165e5744b89568c42495e55e854d8ce0
          git worktree add -q "$RUNNER_TEMP/a" origin/feature/build-agp9-compilesdk37
          git worktree add -q "$RUNNER_TEMP/b" origin/feature/okhttp-r8
          for d in old a b; do echo "$d $(git -C "$RUNNER_TEMP/$d" rev-parse --short HEAD)"; done
      - name: 1 - invoke targets before/after compileSdk 37 (unsigned release, no R8 on both sides)
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/old" && gradle --no-daemon -q :app:assembleRelease -PreleaseVersionCode=200 -PreleaseVersionName=2.0.0)
          (cd "$RUNNER_TEMP/a" && ./gradlew --no-daemon -q :app:assembleRelease -PreleaseVersionCode=200 -PreleaseVersionName=2.0.0)
          BT="$ANDROID_HOME/build-tools/36.0.0"
          refs() { mkdir -p "$2"; unzip -q -o "$1" '*.dex' -d "$2"; for d in "$2"/*.dex; do "$BT/dexdump" -d "$d"; done 2>/dev/null \
            | grep -oE 'invoke-[a-z/-]+ \{[^}]*\}, L[^;]+;\.[^:]+:\([^)]*\)[^ ]+' | sed 's/^invoke-[a-z/-]* {[^}]*}, //' | grep -v '^Lde/evp/\|^Lpoc/' | sort -u; }
          refs "$RUNNER_TEMP/old/app/build/outputs/apk/release/app-release-unsigned.apk" "$RUNNER_TEMP/dex-old" > "$RUNNER_TEMP/refs-old.txt"
          refs "$RUNNER_TEMP/a/app/build/outputs/apk/release/app-release-unsigned.apk" "$RUNNER_TEMP/dex-a" > "$RUNNER_TEMP/refs-a.txt"
          echo "framework/library call targets: old=$(wc -l < "$RUNNER_TEMP/refs-old.txt") new=$(wc -l < "$RUNNER_TEMP/refs-a.txt")"
          if diff "$RUNNER_TEMP/refs-old.txt" "$RUNNER_TEMP/refs-a.txt"; then echo "INVOKE TARGETS IDENTICAL"; else echo "INVOKE TARGETS DIFFER (see above)"; fi
      - name: 2 - lint NewApi (minSdk 26) on the Phase A tree
        run: |
          set -uo pipefail
          cd "$RUNNER_TEMP/a"
          ./gradlew --no-daemon -q :app:lintRelease -PreleaseVersionCode=200 -PreleaseVersionName=2.0.0 > "$RUNNER_TEMP/lint.log" 2>&1; echo "lint exit=$?"
          f=$(ls app/build/reports/lint-results-release.xml 2>/dev/null || true)
          if [ -n "$f" ]; then
            python3 - "$f" <<'PY'
          import collections, sys, xml.etree.ElementTree as ET
          r = ET.parse(sys.argv[1]).getroot()
          c = collections.Counter((i.get('severity'), i.get('id')) for i in r.iter('issue'))
          for (sev, iid), n in sorted(c.items()): print(f"{sev:12} {iid:40} {n}")
          for i in r.iter('issue'):
              if i.get('id') in ('NewApi', 'InlinedApi', 'ObsoleteSdkInt'):
                  loc = i.find('location')
                  print('  ', i.get('id'), loc.get('file').split('/app/')[-1] if loc is not None else '', loc.get('line') if loc is not None else '', i.get('message')[:160])
          PY
          else tail -30 "$RUNNER_TEMP/lint.log"; fi
      - name: 3 - PR 24 - classes.dex of channeltest vs release
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME
          cd "$RUNNER_TEMP/b"
          bash tools/build-channel-native.sh "$RUNNER_TEMP/n" > /dev/null
          bash tools/build-channel-apk.sh "$RUNNER_TEMP/n" > /dev/null
          ./gradlew --no-daemon -q :app:assembleRelease -PreleaseVersionCode=200 -PreleaseVersionName=2.0.0
          for v in channeltest release; do
            apk=$( [ $v = channeltest ] && echo "$RUNNER_TEMP/n/apk/helper-channeltest.apk" || echo app/build/outputs/apk/release/app-release-unsigned.apk )
            unzip -l "$apk" | awk '$4 ~ /\.dex$/ {print $4}' | while read -r d; do echo "$v $d $(unzip -p "$apk" "$d" | sha256sum | cut -c1-64)"; done
          done | tee "$RUNNER_TEMP/dexhash.txt"
          if [ "$(awk '$1=="channeltest"{print $2,$3}' "$RUNNER_TEMP/dexhash.txt")" = "$(awk '$1=="release"{print $2,$3}' "$RUNNER_TEMP/dexhash.txt")" ]; then echo "DEX IDENTICAL channeltest == release"; else echo "DEX DIFFERS"; fi
          echo "== R8 configuration differences channeltest vs release (rule lines only)"
          diff <(grep -v '^#' app/build/outputs/mapping/channeltest/configuration.txt | sed 's/channeltest/VARIANT/g') <(grep -v '^#' app/build/outputs/mapping/release/configuration.txt | sed 's/release/VARIANT/g') || true
