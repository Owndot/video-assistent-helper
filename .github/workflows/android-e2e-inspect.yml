name: Inspect trusted Android input evidence (no emulator)
on:
  push:
    branches: [codex/android-e2e-inspect]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: 40200445981
          repository: Owndot/video-assistent-helper
          github-token: ${{ github.token }}
          pattern: android-e2e-api-*
          path: evidence
      - name: Read actual page pointer events
        run: |
          python3 - <<'PY'
          import json,pathlib
          for file in sorted(pathlib.Path("evidence").glob("**/*-http-events.json")):
              if file.name not in ("player_handoff-http-events.json","player_play_pause-http-events.json","device_volume_brightness_swipes-http-events.json","seek_and_restore-http-events.json"):continue
              rows=json.loads(file.read_text())
              pointers=[r for r in rows if r.get("event")=="pointer"]
              print("TRUSTED_POINTERS",file,json.dumps(pointers))
              pending={}
              for r in pointers:
                  if r["phase"]=="pointerdown":pending[r["pointer"]]=r
                  elif r["pointer"] in pending:
                      old=pending.pop(r["pointer"])
                      print("INPUT_TIMING",file.name,{"phase":r["phase"],"down":[old["x"],old["y"]],"up":[r["x"],r["y"]],
                        "event_ms":round(r["stamp"]-old["stamp"],1),"dispatch_ms":round(r["at"]-old["at"],1),
                        "viewport":[r["width"],r["height"]],"trusted":old["trusted"] and r["trusted"]})
          PY
