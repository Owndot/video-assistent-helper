name: Inspect saved Android seek recordings (no emulator)
on:
  push:
    branches: [codex/android-e2e-inspect]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: 40202803284
          repository: Owndot/video-assistent-helper
          github-token: ${{ github.token }}
          name: android-e2e-api-33
          path: evidence/run25
      - uses: actions/download-artifact@v4
        with:
          run-id: 40203626744
          repository: Owndot/video-assistent-helper
          github-token: ${{ github.token }}
          name: android-e2e-api-33
          path: evidence/run26
      - name: Prepare read-only recording tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg tesseract-ocr
          python3 -m pip install Pillow==11.3.0
      - name: Extract actual existing seek frames and rendered clocks
        run: |
          python3 - <<'PY'
          import pathlib,subprocess,json,io,csv,re,base64
          from PIL import Image
          def words(im):
              output=io.BytesIO();im.save(output,format="PNG")
              p=subprocess.run(["tesseract","stdin","stdout","--psm","11","tsv"],input=output.getvalue(),
                  stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=True,timeout=15)
              return [r for r in csv.DictReader(io.StringIO(p.stdout.decode()),delimiter="\t") if r["text"].strip() and float(r["conf"])>=35]
          for video in sorted(pathlib.Path("evidence").glob("**/seek_and_restore.mp4")):
              duration=float(subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration","-of","csv=p=0",str(video)]))
              begin=max(0,duration-14)
              folder=video.parent/"seek-frame-inspection";folder.mkdir(exist_ok=True)
              subprocess.run(["ffmpeg","-v","error","-y","-ss",str(begin),"-i",str(video),"-vf","fps=2",str(folder/"%03d.png")],check=True)
              frames=sorted(folder.glob("*.png"))
              for i,frame in enumerate(frames):
                  im=Image.open(frame)
                  crop=im.crop((0,int(im.height*.65),im.width,im.height))
                  crop=crop.resize((crop.width*2,crop.height*2),Image.Resampling.LANCZOS)
                  rows=words(crop)
                  clock=[r["text"] for r in rows if re.fullmatch(r"\d{1,2}:\d{2}",r["text"]) and int(r["left"])<crop.width*.3]
                  print("RECORDED_CLOCK",str(video),round(begin+i*.5,2),clock,flush=True)
              from PIL import ImageDraw,ImageFont
              for part in range(0,len(frames),14):
                  group=frames[part:part+14]
                  sheet=Image.new("RGB",(640,90*len(group)),"white")
                  draw=ImageDraw.Draw(sheet);font=ImageFont.load_default(size=15)
                  for n,frame in enumerate(group):
                      im=Image.open(frame)
                      t=begin+(part+n)*.5
                      draw.text((2,n*90+4),str(round(t,2)),fill="black",font=font)
                      pts=im.crop((0,int(im.height*.34),int(im.width*.33),int(im.height*.40)))
                      footer=im.crop((0,int(im.height*.86),int(im.width*.30),int(im.height*.92)))
                      sheet.paste(pts.resize((280,75)),(70,n*90))
                      sheet.paste(footer.resize((280,75)),(355,n*90))
                  output=io.BytesIO();sheet.save(output,format="PNG")
                  print("E2E_PNG_BEGIN "+video.parents[1].name+"-time-grid-"+str(part))
                  encoded=base64.b64encode(output.getvalue()).decode()
                  for at in range(0,len(encoded),12000):print("E2E_PNG_DATA "+encoded[at:at+12000])
                  print("E2E_PNG_END",flush=True)
          PY
