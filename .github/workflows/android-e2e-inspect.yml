name: Read final core Android artifacts (no tests or emulator)
on:
  push:
    branches: [codex/android-e2e-inspect]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: 40208810093
          repository: Owndot/video-assistent-helper
          github-token: ${{ github.token }}
          name: android-e2e-api-33
          path: evidence
      - name: Read preserved results, actual transfer intervals and seek evidence
        run: |
          python3 - <<'PY'
          import pathlib,json,base64
          root=pathlib.Path("evidence")
          for p in sorted(root.glob("**/results.json")):
              rows=json.loads(p.read_text())
              print("CORE_RESULTS",p,json.dumps(rows))
          for p in sorted(root.glob("**/seek-clock-observations.json")):
              print("SEEK_CLOCK",p,p.read_text())
          for p in sorted(root.glob("**/parallel_downloads-http-events.json")):
              rows=json.loads(p.read_text())
              req={r["id"]:r for r in rows if r.get("event")=="request" and r.get("path","").startswith("/slow/parallel-")}
              end={r["id"]:r for r in rows if r.get("event")=="transfer_end" and r.get("id") in req}
              for ident,r in req.items():
                  e=end.get(ident,{})
                  print("TRANSFER",json.dumps({k:r.get(k) for k in ("id","path","received","range","fetch_dest","host","user_agent")}),
                        json.dumps({k:e.get(k) for k in ("received","bytes","complete")}))
              native=[r for r in req.values() if not r.get("fetch_dest") and not r.get("range")]
              for i,a in enumerate(native):
                  for b in native[i+1:]:
                      if a["path"]==b["path"]:continue
                      x,y=end.get(a["id"],{}),end.get(b["id"],{})
                      if x.get("complete") and y.get("complete"):
                          overlap=min(x["received"],y["received"])-max(a["received"],b["received"])
                          print("ACTUAL_NATIVE_TRANSFER_OVERLAP",json.dumps({"ids":[a["id"],b["id"]],"seconds":overlap}))
              for r in rows:
                  if r.get("event")=="request" and r.get("path")=="/page/redirect":
                      print("REDIRECT_PAGE_START",r.get("received"))
          for name in ("parallel_downloads.png","background_pip_return.png"):
              for p in sorted(root.glob("**/"+name)):
                  print("E2E_PNG_BEGIN "+name)
                  encoded=base64.b64encode(p.read_bytes()).decode()
                  for at in range(0,len(encoded),12000):print("E2E_PNG_DATA "+encoded[at:at+12000])
                  print("E2E_PNG_END")
          print("PRESERVED_FILES",[str(p.relative_to(root)) for p in root.glob("**/*") if p.is_file()])
          PY
