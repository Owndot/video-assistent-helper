name: Android seek observation regression only (no emulator)
on:
  push:
    branches: [codex/android-e2e-inspect]
permissions:
  contents: read
jobs:
  observation:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 91284c651e4c1e68e650ecd090d2387e2fe38e18
          persist-credentials: false
      - name: New host-only observation regression
        run: |
          python3 -m py_compile tests/android_e2e/run.py tests/android_e2e/test_seek_clock.py
          python3 -m unittest discover -s tests/android_e2e -p test_seek_clock.py -v
      - name: Confirm predecessor rejects its first stale clock observation
        run: |
          python3 - <<'PY'
          import ast,urllib.request
          url="https://raw.githubusercontent.com/Owndot/video-assistent-helper/e3e50882a791e613e4b2a58771a1c85ddef9beb6/tests/android_e2e/run.py"
          with urllib.request.urlopen(url,timeout=30) as response:
              source=response.read().decode()
          fn=next(n for n in ast.parse(source).body if isinstance(n,ast.FunctionDef) and n.name=="seek_restore")
          index=next(i for i,n in enumerate(fn.body) if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=="sampled_at" for t in n.targets))
          fn.body=fn.body[:index]
          class Element:
              exists=True
              def click(self):pass
          class Device:
              def __call__(self,**kwargs):return Element()
          class Clock:
              def monotonic(self):return 0
              def sleep(self,seconds):pass
          clocks=iter([["0:01"],["0:01"]])
          context={"D":Device(),"time":Clock(),"player_entry":lambda:Element(),
                   "wait":lambda *args,**kwargs:True,"reveal":lambda:True,
                   "playing_times":lambda:next(clocks)}
          exec(compile(ast.Module(body=[fn],type_ignores=[]),"actual-e3e5088-seek_restore","exec"),context)
          try:
              context["seek_restore"]()
          except AssertionError as error:
              assert str(error)=="Forward seek did not advance by the default ten seconds",str(error)
              print("PASS: actual e3e5088 single-snapshot seek check rejects a stale first frame.")
          else:
              raise AssertionError("Predecessor unexpectedly accepted a stale first frame")
          print("This is a host observation regression with stubbed input; no Android/browser integration was executed.")
          PY
