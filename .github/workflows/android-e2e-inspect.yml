name: Inspect existing Android E2E evidence (no emulator)
on:
  push:
    branches: [codex/android-e2e-inspect]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Completed Android E2E run to inspect'
        required: true
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: source
        env:
          RUN_ID: ${{ inputs.run_id || '' }}
        run: |
          python3 - <<'PY'
          import json,os
          value=os.environ["RUN_ID"] or str(json.load(open("tests/android_e2e/execution.json"))["previous_run"])
          assert value.isdigit()
          with open(os.environ["GITHUB_OUTPUT"],"a") as out: out.write("run_id="+value+"\n")
          PY
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          pattern: android-e2e-api-*
          path: evidence
      - name: Read existing UI and browser evidence
        run: |
          python3 - <<'PY'
          import pathlib,re,base64,xml.etree.ElementTree as ET
          def safe(text):
              return re.sub(r"[0-9a-f]{32}", "<disposable-id>", text)
          for file in sorted(pathlib.Path("evidence").glob("**/*")):
              if file.name in ("results.json","web-ext.log"):
                  print("EVIDENCE_FILE",file,safe(file.read_text(errors="replace")[-60000:]))
              elif file.name.endswith("-http-events.json") and file.name.startswith(("player_play_pause","device_volume","player_handoff")):
                  import json
                  rows=json.loads(file.read_text())
                  print("OWNED_HTTP_TRACE",file,[{k:r[k] for k in ("path","event","host","received","cookie","authorization","fetch_dest") if k in r} for r in rows if r.get("event")=="request"])
              elif file.name=="logcat.txt":
                  lines=file.read_text(errors="replace").splitlines()
                  print("BROWSER_ERRORS",file,safe("\n".join(line for line in lines if re.search(r"JavaScript|Content Script|kadri|TypeError|ReferenceError|SyntaxError|mozHasAudio|WebExtension",line,re.I))[-40000:]))
              elif file.name in ("real_extension_install.xml","player_play_pause.xml","browser-chooser.xml","real_browser_pairing.xml","pairing_reset_roundtrip.xml"):
                  print("UI_NODES",file,safe(str([n.attrib for n in ET.fromstring(file.read_text().replace("<disposable-pair-key>","[disposable-pair-key]")).iter("node")])[:40000]))
              elif False:
                  print("E2E_PNG_BEGIN "+file.parent.name+"-"+file.name)
                  encoded=base64.b64encode(file.read_bytes()).decode()
                  for at in range(0,len(encoded),12000): print("E2E_PNG_DATA "+encoded[at:at+12000])
                  print("E2E_PNG_END")
          PY
      - name: Summarize existing resource observations
        run: |
          python3 - <<'PY'
          import pathlib,json,re,statistics
          for file in sorted(pathlib.Path("evidence").glob("**/*memory.json")):
              rows=json.loads(file.read_text())
              values=[]
              for row in rows:
                  raw=row.get("meminfo","")
                  match=re.search(r"TOTAL PSS:\s*(\d+)",raw)
                  if match: values.append(int(match[1]))
              if values:
                  print("MEMORY_OBSERVATION",file,{"pss_kib":values,"min_kib":min(values),"max_kib":max(values),"median_kib":statistics.median(values),"note":"instrumented observations; not a leak verdict or stable-version comparison"})
          for file in sorted(pathlib.Path("evidence").glob("**/player-cycle-observations.json")):
              rows=json.loads(file.read_text())
              print("PLAYER_OBSERVATIONS",file,[{k:v for k,v in r.items() if k in ("cycle","entry_to_controls_ms")} for r in rows])
          PY
      - name: Read rendered clocks from actual captured Android frames
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr
          python3 -m pip install Pillow==11.3.0 opencv-python-headless==4.12.0.88 CairoSVG==2.8.2
          python3 - <<'PY'
          import sys,pathlib
          sys.path.insert(0,"tests/android_e2e")
          import visual
          from PIL import Image
          for file in sorted(pathlib.Path("evidence").glob("**/player_play_pause.png")):
              im=Image.open(file)
              print("RENDERED_CLOCK",file,visual.words(im.crop((0,int(im.height*.65),im.width,im.height))))
          for file in sorted(pathlib.Path("evidence").glob("**/subtitle_selection.png")):
              im=Image.open(file).convert("RGB")
              vw=min(im.width,im.height*16/9); vh=vw*9/16; top=(im.height-vh)/2
              crop=im.crop((int((im.width-vw)/2),int(top+vh*.70),int((im.width+vw)/2),int(top+vh)))
              print("SUBTITLE_CROP",file,visual.words(crop))
              import numpy as np
              from PIL import ImageOps
              clean=Image.fromarray(np.where(np.min(np.array(crop),axis=2)>200,0,255).astype("uint8"))
              print("SUBTITLE_WHITE",file,visual.words(clean.resize((clean.width*2,clean.height*2))))
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Existing full native core regression (host JVM, not Android)
        run: |
          tests/java/build.sh
          tests/java/run_core_tests.sh
