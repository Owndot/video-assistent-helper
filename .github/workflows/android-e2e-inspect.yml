name: Inspect Android cancellation evidence (no emulator)
on:
  push:
    branches: [codex/android-e2e-inspect]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: 40197766277
          repository: Owndot/video-assistent-helper
          github-token: ${{ github.token }}
          pattern: android-e2e-api-*
          path: evidence
      - name: Read completed cancellation transfer timelines
        run: |
          python3 - <<'PY'
          import pathlib,json
          for file in sorted(pathlib.Path("evidence").glob("**/download_cancel-http-events.json")):
              rows=json.loads(file.read_text())
              first=min((r["received"] for r in rows),default=0)
              starts={r["id"]:r for r in rows if r.get("event")=="request" and r.get("path","").startswith("/slowhls/") and not r.get("fetch_dest")}
              ends=[r for r in rows if r.get("event")=="transfer_end" and r.get("id") in starts]
              print("NATIVE_CANCEL_TRANSFERS",file,{"first_case_event":first,
                "requests":[{"path":r["path"],"relative_s":round(r["received"]-first,3),"id":r["id"]} for r in starts.values()],
                "ends":[{"path":r["path"],"relative_s":round(r["received"]-first,3),"duration_s":round(r["received"]-starts[r["id"]]["received"],3),"bytes":r.get("bytes"),"complete":r.get("complete")} for r in ends]})
          PY
