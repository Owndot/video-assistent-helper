name: Inspect existing Android E2E evidence (no emulator)
on:
  push:
    branches: [codex/android-e2e-inspect]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Completed Android E2E run to inspect'
        required: true
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: source
        env:
          RUN_ID: ${{ inputs.run_id || '' }}
        run: |
          python3 - <<'PY'
          import json,os
          value=os.environ["RUN_ID"] or str(json.load(open("tests/android_e2e/execution.json"))["previous_run"])
          assert value.isdigit()
          with open(os.environ["GITHUB_OUTPUT"],"a") as out: out.write("run_id="+value+"\n")
          PY
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          pattern: android-e2e-api-*
          path: evidence
      - name: Read existing UI and browser evidence
        run: |
          python3 - <<'PY'
          import pathlib,re,base64,xml.etree.ElementTree as ET
          def safe(text):
              return re.sub(r"[0-9a-f]{32}", "<disposable-id>", text)
          for file in sorted(pathlib.Path("evidence").glob("**/*")):
              if file.name in ("results.json","web-ext.log"):
                  print("EVIDENCE_FILE",file,safe(file.read_text(errors="replace")[-60000:]))
              elif file.name=="logcat.txt":
                  lines=file.read_text(errors="replace").splitlines()
                  print("BROWSER_ERRORS",file,safe("\n".join(line for line in lines if re.search(r"JavaScript|Content Script|kadri|TypeError|ReferenceError|SyntaxError|mozHasAudio|WebExtension",line,re.I))[-40000:]))
              elif file.name=="real_extension_install.xml":
                  print("UI_NODES",file,safe(str([n.attrib for n in ET.parse(file).iter("node")])[:40000]))
              elif file.name=="real_extension_install.png":
                  print("E2E_PNG_BEGIN "+file.name)
                  encoded=base64.b64encode(file.read_bytes()).decode()
                  for at in range(0,len(encoded),12000): print("E2E_PNG_DATA "+encoded[at:at+12000])
                  print("E2E_PNG_END")
          PY
      - name: Calibrate screenshot recognition without an emulator
        run: |
          python3 -m pip install Pillow==11.3.0 opencv-python-headless==4.12.0.88 CairoSVG==2.8.2
          python3 - <<'PY'
          import sys,pathlib
          sys.path.insert(0,"tests/android_e2e")
          from PIL import Image
          import visual
          file=next(pathlib.Path("evidence").glob("**/real_extension_install.png"))
          im=Image.open(file)
          for density in (2,2.5,2.625,2.75,3):
              print("CALIBRATE",density,visual.locate(im,"I.player",density,-1),flush=True)
          import base64,io
          for name,im in (("entry-crop.png",im.crop((940,1250,1030,1340))),("entry-template.png",Image.fromarray(visual.template("I.player",60)))):
              buffer=io.BytesIO()
              im.save(buffer,format="PNG")
              print("E2E_PNG_BEGIN "+name)
              print("E2E_PNG_DATA "+base64.b64encode(buffer.getvalue()).decode())
              print("E2E_PNG_END")
          PY
