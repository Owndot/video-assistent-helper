name: Read final transfer completion (no tests or emulator)
on:
  push:
    branches: [codex/android-e2e-inspect]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: 40208810093
          repository: Owndot/video-assistent-helper
          github-token: ${{ github.token }}
          name: android-e2e-api-33
          path: evidence
      - name: Join already recorded request and later completion snapshots
        run: |
          python3 - <<'PY'
          import json,pathlib
          rows={}
          for p in pathlib.Path("evidence/kadri").glob("*-http-events.json"):
              for r in json.loads(p.read_text()):
                  rows[(r.get("event"),r.get("id"),r.get("received"))]=r
          rows=list(rows.values())
          native=[r for r in rows if r.get("event")=="request" and r.get("path","").startswith("/slow/parallel-") and not r.get("range") and not r.get("fetch_dest")]
          ends={r["id"]:r for r in rows if r.get("event")=="transfer_end"}
          redirect=[r for r in rows if r.get("event")=="request" and r.get("path")=="/page/redirect"]
          for r in native:
              print("NATIVE_BEGIN",json.dumps(r));print("NATIVE_END",json.dumps(ends.get(r["id"])))
          for i,a in enumerate(native):
              for b in native[i+1:]:
                  if a["path"]==b["path"]:continue
                  x,y=ends.get(a["id"],{}),ends.get(b["id"],{})
                  if x.get("complete") and y.get("complete"):
                      left=max(a["received"],b["received"]);right=min(x["received"],y["received"])
                      print("ACTUAL_COMPLETE_OVERLAP_SECONDS",right-left)
                      print("REDIRECT_PAGE_DURING_BOTH_TRANSFERS",[r["received"] for r in redirect if left<=r["received"]<=right])
          PY
