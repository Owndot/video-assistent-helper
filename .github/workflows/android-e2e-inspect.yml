name: Bounded native header and socket diagnostics
on:
  push:
    branches: [codex/android-e2e-inspect]
permissions:
  contents: read
jobs:
  stop-stalled-run:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Cancel only the stalled test run (no release or repository mutation)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json,os
          base="https://api.github.com/repos/Owndot/video-assistent-helper/actions/runs/40219442784"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"}
          with urllib.request.urlopen(urllib.request.Request(base,headers=headers),timeout=20) as r:
              state=json.load(r)["status"]
          if state!="completed":
              try:
                  with urllib.request.urlopen(urllib.request.Request(base+"/cancel",headers=headers,data=b"",method="POST"),timeout=20) as r:
                      print("Requested cancellation of stalled test run40219442784:",r.status)
              except urllib.error.HTTPError as e:
                  if e.code!=409:raise
                  print("Run already ending; cancellation no longer applicable")
          else: print("Run already completed; no cancellation")
          PY
  focused:
    needs: stop-stalled-run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 29158de32ff2a21aab9d2011d01c67892f7d430b
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile existing native tests
        run: tests/java/build.sh
      - name: Isolated referrer privacy (45s cap and thread dump on timeout)
        run: timeout --signal=QUIT --kill-after=5s 45s java -cp tests/java/classes de.evp.helfer.TestReferrerPrivacy
      - name: Isolated TLS boundary
        if: always()
        run: timeout --signal=QUIT --kill-after=5s 45s java -cp tests/java/classes de.evp.helfer.TestTlsCookieBoundary
      - name: Isolated bounded local sockets
        if: always()
        run: timeout --signal=QUIT --kill-after=5s 45s java -cp tests/java/classes TestMiniServerLimits
