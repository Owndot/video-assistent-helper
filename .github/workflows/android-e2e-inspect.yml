name: Native regression and Android evidence (no emulator)
on:
  push:
    branches: [codex/android-e2e-inspect]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4b472f8351f86c7a1a78ea72e1658467bb7d9c8e
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare host media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Verify full core suite with strict failure and decoding assertions
        run: |
          tests/java/build.sh
          tests/java/run_core_tests.sh
          git fetch --no-tags --depth=1 origin c6d0cde3cb74e785888e3a1c55e9091deb708bb4
          mkdir -p "$RUNNER_TEMP/legacy-core"
          git show FETCH_HEAD:tests/java/jt/TestMain.java > "$RUNNER_TEMP/legacy-core/TestMain.java"
          javac -cp tests/java/classes -d "$RUNNER_TEMP/legacy-core" "$RUNNER_TEMP/legacy-core/TestMain.java"
          if java -cp "$RUNNER_TEMP/legacy-core:tests/java/classes" TestCoreHarnessFailure > "$RUNNER_TEMP/legacy-core.log" 2>&1; then
            echo 'FAIL: regression unexpectedly passed broken original TestMain'
            exit 1
          fi
          echo 'PASS: regression fails on original TestMain and passes corrected full suite'
          tail -4 "$RUNNER_TEMP/legacy-core.log"
      - uses: actions/download-artifact@v4
        with:
          run-id: 40197766277
          github-token: ${{ github.token }}
          pattern: android-e2e-api-*
          path: evidence
      - name: Read actual large-file Helper memory observations
        run: |
          python3 - <<'PY'
          import pathlib,json,re
          for file in pathlib.Path("evidence").glob("**/large-download-memory.json"):
              rows=json.loads(file.read_text())
              values=[]
              for row in rows:
                  m=re.search(r"TOTAL PSS:\s*(\d+)",row.get("de.evp.helfer.debug",""))
                  if m:values.append(int(m[1]))
              print("LARGE_FILE_HELPER_PSS",file,values,"KiB; sampled observations, not measured peak/leak verdict")
          PY
