name: Browser-Tests

# Alle Tests aus tests/browser – einmal in Chromium, einmal in Firefox.
# Läuft bei Änderungen am Skript oder an den Tests (und von Hand über "Run workflow").
on:
  push:
    branches: [main]
    paths: ['src/**', 'tools/**', 'userscript/**', 'tests/**', '.github/workflows/browser-tests.yml']
  workflow_dispatch:
    inputs:
      tests:
        description: 'Welche Tests (Muster, z. B. test_fb*.py; Messungen: mess_*.py)'
        default: 'test_*.py'
      browsers:
        description: 'Browser (JSON-Liste)'
        default: '["chromium","firefox-neu"]'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # chromium: Playwright 1.56 · firefox-neu: neueste Playwright (aktuelles Firefox) · firefox: Firefox 142 (nur von Hand; erzeugt dort bei Maus keine Zeiger-Ereignisse)
        browser: ${{ fromJSON(github.event.inputs.browsers || '["chromium","firefox-neu"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Userscript passt zu src/
        run: node tools/build.js --check

      - name: Werkzeuge
        run: |
          # Chromium: gleiche Version wie beim Entwickeln (neuere verweigern Größenänderung im Vollbild)
          if [ "${{ matrix.browser }}" = firefox-neu ]; then pip install playwright pillow; else pip install playwright==1.56.0 pillow; fi
          python -m playwright install --with-deps ${{ matrix.browser == 'chromium' && 'chromium' || 'firefox' }}
          sudo apt-get install -y ffmpeg

      - name: Tests (${{ matrix.browser }})
        env:
          BROWSER: ${{ matrix.browser == 'chromium' && 'chromium' || 'firefox' }}
          TESTS: ${{ github.event.inputs.tests || 'test_*.py' }}
        run: |
          cd tests/browser
          # streng: jede fehlgeschlagene Prüfung / jeder Absturz macht den Lauf rot (Ergebnis steht trotzdem in der Übersicht)
          ./run_all.sh | tee ergebnis-${{ matrix.browser }}.txt; status=${PIPESTATUS[0]}
          # Messung (kein Bestehen/Durchfallen) nur in Chromium – braucht dessen Messwerte (CDP)
          if [ "$BROWSER" = chromium ] && [ -z "${{ github.event.inputs.tests }}" ]; then TESTS=mess_perf.py ./run_all.sh | tee -a ergebnis-${{ matrix.browser }}.txt; fi
          echo '### Ergebnis ${{ matrix.browser }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat ergebnis-${{ matrix.browser }}.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.browser }}
          path: |
            tests/browser/ergebnis-*.txt
            tests/browser/*.png
          if-no-files-found: ignore
