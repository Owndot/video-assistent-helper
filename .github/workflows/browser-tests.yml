name: Browser-Tests

# Alle Tests aus tests/browser – einmal in Chromium, einmal in Firefox.
# Native Java changes are covered by Helper safe validation and the deliberate Android E2E run.
# Läuft bei Änderungen am Skript oder an den Tests (und von Hand über "Run workflow").
on:
  push:
    branches: [main, codex/security-phase-1]
    paths: ['src/**', 'tools/build.js', 'userscript/**', 'tests/browser/**']
  pull_request:
    paths: ['src/**', 'userscript/**', 'tests/browser/**', '.github/workflows/browser-tests.yml']
  workflow_dispatch:
    inputs:
      tests:
        description: 'Welche Tests (Muster, z. B. test_fb*.py; Messungen: mess_*.py)'
        default: 'test_*.py'
      browsers:
        description: 'Browser (JSON-Liste)'
        default: '["chromium","firefox-neu"]'

permissions:
  contents: read

jobs:
  firefox-precheck:
    # PRs first prove only the two corrected Firefox cases; failed prechecks block the matrix.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Userscript passt zu src/
        run: node tools/build.js --check

      - uses: actions/cache/restore@v4
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-firefox-neu-1.64.1

      - name: Werkzeuge
        timeout-minutes: 8
        run: |
          # Avoid the known hanging Azure mirror; retain normal Ubuntu trust.
          for source in /etc/apt/apt-mirrors.txt /etc/apt/apt-mirrors-security.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$source" ]; then
              sudo sed -Ei 's#https?://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' "$source"
            fi
          done
          echo 'Acquire::Retries "1"; Acquire::http::Timeout "20"; Acquire::https::Timeout "20";' | sudo tee /etc/apt/apt.conf.d/99-evp-ci-timeouts > /dev/null
          # Same pinned Firefox engine as the existing regression job.
          pip install playwright==1.64.1 pillow==13.0.0
          python -m playwright install --with-deps firefox
          sudo apt-get install -y ffmpeg

      - uses: actions/cache/save@v4
        if: steps.browser-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-firefox-neu-1.64.1

      - name: Only the two remaining Firefox cases
        env:
          BROWSER: firefox
          TESTS: 'test_mirrorprev.py test_seamless.py'
        run: tests/browser/run_all.sh
      - name: Exact precheck logs
        if: always()
        run: |
          python - <<'PYLOG'
          from pathlib import Path
          for name in ('test_mirrorprev', 'test_seamless'):
              p = Path('tests/browser/out') / (name + '.log')
              if p.exists():
                  print(p)
                  print(p.read_text())
          PYLOG

  test:
    needs: firefox-precheck
    if: ${{ !cancelled() && (needs.firefox-precheck.result == 'success' || needs.firefox-precheck.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # chromium: Playwright 1.56 · firefox-neu: pinned Playwright 1.64.1 (validated Firefox engine) · firefox: Firefox 142 (nur von Hand; erzeugt dort bei Maus keine Zeiger-Ereignisse)
        browser: ${{ fromJSON(github.event.inputs.browsers || '["chromium","firefox-neu"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Userscript passt zu src/
        run: node tools/build.js --check

      - uses: actions/cache/restore@v4
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ matrix.browser == 'chromium' && '1.56.0' || '1.64.1' }}

      - name: Werkzeuge
        timeout-minutes: 8
        run: |
          # Avoid the known hanging Azure mirror; retain normal Ubuntu trust.
          for source in /etc/apt/apt-mirrors.txt /etc/apt/apt-mirrors-security.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$source" ]; then
              sudo sed -Ei 's#https?://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' "$source"
            fi
          done
          echo 'Acquire::Retries "1"; Acquire::http::Timeout "20"; Acquire::https::Timeout "20";' | sudo tee /etc/apt/apt.conf.d/99-evp-ci-timeouts > /dev/null
          # Chromium: gleiche Version wie beim Entwickeln (neuere verweigern Größenänderung im Vollbild)
          if [ "${{ matrix.browser }}" = firefox-neu ]; then pip install playwright==1.64.1 pillow==13.0.0; else pip install playwright==1.56.0 pillow==13.0.0; fi
          python -m playwright install --with-deps ${{ matrix.browser == 'chromium' && 'chromium' || 'firefox' }}
          sudo apt-get install -y ffmpeg

      - uses: actions/cache/save@v4
        if: steps.browser-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ matrix.browser == 'chromium' && '1.56.0' || '1.64.1' }}

      - name: Tests (${{ matrix.browser }})
        env:
          BROWSER: ${{ matrix.browser == 'chromium' && 'chromium' || 'firefox' }}
          TESTS: ${{ github.event.inputs.tests || (github.event_name == 'pull_request' && 'test_dvr.py test_framekey.py test_mirrorprev.py test_prevretry.py test_scrubbar.py test_scrubfuzz.py test_seamless.py test_swipeseek.py') || 'test_*.py' }}
        run: |
          cd tests/browser
          # streng: jede fehlgeschlagene Prüfung / jeder Absturz macht den Lauf rot (Ergebnis steht trotzdem in der Übersicht)
          set +e
          ./run_all.sh | tee ergebnis-${{ matrix.browser }}.txt; status=${PIPESTATUS[0]}
          set -e
          # Messung (kein Bestehen/Durchfallen) nur in Chromium – braucht dessen Messwerte (CDP)
          if [ "${{ github.event_name }}" != pull_request ] && [ "$BROWSER" = chromium ] && [ -z "${{ github.event.inputs.tests }}" ]; then TESTS=mess_perf.py ./run_all.sh | tee -a ergebnis-${{ matrix.browser }}.txt; fi
          echo '### Ergebnis ${{ matrix.browser }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat ergebnis-${{ matrix.browser }}.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Exact failed assertions
        if: always()
        run: |
          python - <<'PYLOG'
          from pathlib import Path
          for p in sorted(Path('tests/browser/out').glob('*.log')):
              for line in p.read_text().splitlines():
                  if any(k in line for k in ('FAIL ', 'ERGEBNIS:', 'Error:', 'Traceback', 'Pointer:', 'outside viewport')):
                      print(str(p) + ': ' + line)
          PYLOG

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.browser }}
          path: |
            tests/browser/ergebnis-*.txt
            tests/browser/*.png
            tests/browser/out/*.log
          if-no-files-found: ignore
