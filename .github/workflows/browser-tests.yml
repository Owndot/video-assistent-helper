name: Browser-Tests

# Alle Tests aus tests/browser – einmal in Chromium, einmal in Firefox.
# Läuft bei Änderungen am Skript oder an den Tests (und von Hand über "Run workflow").
on:
  push:
    branches: [main]
    paths: ['userscript/**', 'tests/**', '.github/workflows/browser-tests.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Werkzeuge
        run: |
          pip install playwright
          python -m playwright install --with-deps ${{ matrix.browser }}
          sudo apt-get install -y ffmpeg

      - name: Tests (${{ matrix.browser }})
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          cd tests/browser
          ./run_all.sh | tee ergebnis-${{ matrix.browser }}.txt
          echo '### Ergebnis ${{ matrix.browser }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat ergebnis-${{ matrix.browser }}.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Ergebnisse in Zweig ergebnisse-${{ matrix.browser }}
        if: always()
        run: |
          d=$(mktemp -d); cp tests/browser/ergebnis-*.txt "$d"/ 2>/dev/null; cp -r tests/browser/out "$d"/ 2>/dev/null
          cp tests/browser/*.png "$d"/ 2>/dev/null || true
          cd "$d" && git init -q && git checkout -q -b e
          git add -A && git -c user.name=ci -c user.email=ci@local commit -qm "Ergebnis ${{ matrix.browser }} ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" e:ergebnisse-${{ matrix.browser }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.browser }}
          path: |
            tests/browser/ergebnis-*.txt
            tests/browser/*.png
          if-no-files-found: ignore
