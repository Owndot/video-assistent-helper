name: Helper safe validation
on:
  push:
    branches: [main]
    paths: ['app/**', 'src/**', 'userscript/**', 'vendor/**', 'tests/**', 'tools/**', '.github/workflows/**']
  workflow_dispatch:
  pull_request:
    paths: ['app/**', 'src/**', 'userscript/**', 'vendor/**', 'tests/**', 'tools/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  privacy:
    if: github.head_ref != 'codex/firefox-nine' && github.event_name != 'push' && github.head_ref != 'codex/helper-beta-auth-beta1' && github.head_ref != 'codex/local-release-option-a' && github.head_ref != 'codex/pairing-key-recovery' && github.head_ref != 'codex/native-media-memory' && github.head_ref != 'codex/browser-proxy-memory'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test tools only
        timeout-minutes: 8
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '30000'
        run: |
          set -euo pipefail
          # The existing native job uses the same official mirror to avoid Azure stalls.
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          fi
          timeout 90 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
          timeout 180 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends ffmpeg xvfb
          pip install --timeout 30 --retries 1 playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Prove the current main leaks synthetic secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api 'repos/Owndot/video-assistent-helper/contents/src/080-helper-app.js?ref=862f41a48e7b27396d7994150f8abc98b4fcbb73' --jq .content | base64 --decode > /tmp/previous-helper.js
          gh api 'repos/Owndot/video-assistent-helper/contents/userscript/video-assistent.user.js?ref=862f41a48e7b27396d7994150f8abc98b4fcbb73' --jq .content | base64 --decode > /tmp/previous-userscript.js
          if node tests/security/gm_headers.js /tmp/previous-helper.js > /tmp/previous-gm.log 2>&1; then echo 'Baseline leak not reproduced'; exit 1; fi
          grep -q 'GM request leaked synthetic page secret' /tmp/previous-gm.log
          tests/java/build.sh
          gh api 'repos/Owndot/video-assistent-helper/contents/app/src/main/java/de/evp/helfer/Fetcher.java?ref=862f41a48e7b27396d7994150f8abc98b4fcbb73' --jq .content | base64 --decode > /tmp/Fetcher.java
          javac -cp tests/java/classes -d /tmp/privacy-old /tmp/Fetcher.java
          if java -cp /tmp/privacy-old:tests/java/classes de.evp.helfer.TestReferrerPrivacy > /tmp/previous-referrer.log 2>&1; then echo 'Baseline leak not reproduced'; exit 1; fi
          grep -q 'Cross-origin path/query escaped in Referer' /tmp/previous-referrer.log
          echo 'PASS: actual main leaks synthetic secrets in GM and native requests'
      - name: Corrected referrer and real HTTP/HTTPS tests
        run: |
          set -euo pipefail
          node tools/build.js --check
          node tests/security/hls_license.js
          node tests/security/referrer.js
          node tests/security/gm_headers.js
          java -cp tests/java/classes de.evp.helfer.TestReferrerPrivacy
          java -cp tests/java/classes de.evp.helfer.TestTlsCookieBoundary
      - name: Pinned test manager and local media fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/violentmonkey/violentmonkey/releases/assets/518076373 -H 'Accept: application/octet-stream' > /tmp/violentmonkey.zip
          echo '583ac595bb698a926eadb6064431fce1108dc2f2adb966ed984738824d2d5a54  /tmp/violentmonkey.zip' | sha256sum -c -
          mkdir -p /tmp/violentmonkey /tmp/privacy-media
          unzip -q /tmp/violentmonkey.zip -d /tmp/violentmonkey
          # Playwright Chromium omits proprietary codecs; use a fixed official testing build for AVC/HLS.
          curl --fail --location --retry 2 --max-time 180 https://storage.googleapis.com/chrome-for-testing-public/141.0.7390.122/linux64/chrome-linux64.zip -o /tmp/chrome.zip
          unzip -q /tmp/chrome.zip -d /tmp
          ffmpeg -v error -y -f lavfi -i testsrc2=size=320x180:rate=24 -t 8 -c:v libx264 -threads 1 -pix_fmt yuv420p -g 48 -movflags +faststart /tmp/privacy-media/clip.mp4
          ffmpeg -v error -y -i /tmp/privacy-media/clip.mp4 -c copy -hls_time 2 -hls_playlist_type vod /tmp/privacy-media/index.m3u8
      - name: Dependency tamper, total payload and startup budget
        run: python3 -u tests/security/bundle.py
      - name: Real manager installation, update, redirects and media functions
        env:
          VM_DIR: /tmp/violentmonkey
          BROWSER_EXECUTABLE: /tmp/chrome-linux64/chrome
        run: xvfb-run -a python3 -u tests/security/browser.py --userscript
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: privacy-test-evidence
          path: validation-results/privacy-*.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hls-size-and-startup
          path: validation-results/hls-bundle.json
          if-no-files-found: ignore
  download-manager-privacy:
    if: github.head_ref != 'codex/firefox-nine' && github.event_name != 'push' && github.head_ref != 'codex/helper-beta-auth-beta1' && github.head_ref != 'codex/local-release-option-a' && github.head_ref != 'codex/pairing-key-recovery' && github.head_ref != 'codex/native-media-memory' && github.head_ref != 'codex/browser-proxy-memory'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build isolated instrumentation APKs only
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest -Pandroid.useAndroidX=true --no-daemon
      - name: Enable KVM on the disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w de.evp.helfer.debug.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/download-manager-test.log
            grep -q 'OK (1 test)' /tmp/download-manager-test.log
  validate:
    if: github.head_ref != 'codex/firefox-nine' && github.event_name != 'push' && github.head_ref != 'codex/helper-beta-auth-beta1' && github.head_ref != 'codex/pairing-key-recovery' && github.head_ref != 'codex/native-media-memory' && github.head_ref != 'codex/browser-proxy-memory'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Reproduce missing ancestry in the normal shallow checkout
        if: github.head_ref == 'codex/local-release-option-a'
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-shallow-repository)" = true
          if git merge-base --is-ancestor d1119234e25273210d0807961058484058cc0f49 HEAD; then
            echo 'Shallow ancestry failure not reproduced'; exit 1
          fi
          echo 'PASS: actual depth-1 validate checkout reproduces missing ancestry'
      - name: Fetch complete ancestry for the exact checked-out commit
        run: |
          set -euo pipefail
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --unshallow origin "$(git rev-parse HEAD)"
          fi
          test "$(git rev-parse --is-shallow-repository)" = false
          git merge-base --is-ancestor d1119234e25273210d0807961058484058cc0f49 HEAD
          echo 'PASS: complete ancestry available; prepare-release.py ancestry check remains unchanged'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Host security tests
        run: |
          python3 -m unittest discover -s tests/security -v
          python3 -m py_compile tests/android_e2e/*.py
          python3 -m unittest discover -s tests/android_e2e -p test_seek_clock.py -v
          python3 -m py_compile tools/profile-helper.py tools/check-update.py tools/compare-exposed-signature.py
          for script in tools/collect-device-snapshot.sh tools/build-migration-fixtures.sh tools/test-migration-device.sh; do bash -n "$script"; done
      - name: Userscript credential boundary regression
        if: github.head_ref != 'codex/local-release-option-a'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node tools/build.js --check
          node tests/security/hls_license.js
          node tests/cookie_sites.js
          old="$RUNNER_TEMP/old-cookie-sites.js"
          gh api 'repos/Owndot/video-assistent-helper/contents/src/070-extern-ytdlnis.js?ref=6111df1a96854f659d7ab94bbaed399230cf1435' --jq .content | base64 --decode > "$old"
          if node tests/cookie_sites.js "$old" > "$RUNNER_TEMP/old-cookie-sites.log" 2>&1; then
            echo 'Old userscript boundary unexpectedly passed'; exit 1
          fi
          grep -q 'foreign eu.org tenant was trusted' "$RUNNER_TEMP/old-cookie-sites.log"
          echo 'PASS: old userscript tenant scope fails the new regression'
      - name: JVM compilation and exclusive-port test
        if: github.head_ref != 'codex/local-release-option-a'
        run: |
          tests/java/build.sh
          java -cp tests/java/classes TestPortConflict
      - name: Prove TLS and socket regressions against the actual predecessor
        if: github.head_ref != 'codex/local-release-option-a'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          gh api 'repos/Owndot/video-assistent-helper/contents/app/src/main/java/de/evp/helfer/Fetcher.java?ref=22d94d2e936052440a54d0368b68d6d7a15dd402' --jq .content | base64 --decode > "$work/Fetcher.java"
          gh api 'repos/Owndot/video-assistent-helper/contents/app/src/main/java/de/evp/helfer/MiniServer.java?ref=22d94d2e936052440a54d0368b68d6d7a15dd402' --jq .content | base64 --decode > "$work/MiniServer.java"
          javac -cp tests/java/classes -d "$work/old" "$work/Fetcher.java" "$work/MiniServer.java"
          if timeout 30 java -cp "$work/old:tests/java/classes" de.evp.helfer.TestTlsCookieBoundary > "$work/old-tls.log" 2>&1; then
            echo 'Previous HTTPS-to-HTTP cookie leak was not rejected'; exit 1
          fi
          grep -q 'Cookie sent from HTTPS page to initial HTTP target' "$work/old-tls.log"
          echo 'PASS: actual predecessor leaks HTTPS-page Cookie on the initial HTTP request'
          if timeout 15 java -cp "$work/old:tests/java/classes" de.evp.helfer.TestReferrerPrivacy > "$work/old-referrer.log" 2>&1; then
            echo 'Previous referrer privacy regression unexpectedly passed'; exit 1
          fi
          grep -q 'Userinfo or fragment escaped in Referer' "$work/old-referrer.log"
          echo 'PASS: actual predecessor exposes referrer userinfo/fragment'
          if timeout 15 java -cp "$work/old:tests/java/classes" TestMiniServerLimits --stop-only > "$work/old-socket.log" 2>&1; then
            echo 'Previous socket shutdown regression unexpectedly passed'; exit 1
          fi
          grep -q 'Accepted connection remained open after stop' "$work/old-socket.log"
          echo 'PASS: actual predecessor leaves accepted socket open after stop'
      - name: Compare rapid-restart regression with previous listener
        if: github.head_ref != 'codex/local-release-option-a'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          gh api 'repos/Owndot/video-assistent-helper/contents/app/src/main/java/de/evp/helfer/MiniServer.java?ref=e7672d277f1c0488bb4c187c0ead6a2d3f07fa57' --jq .content | base64 --decode > "$work/MiniServer.java"
          javac -cp tests/java/classes -d "$work/old" "$work/MiniServer.java"
          reproduced=false
          for trial in 1 2 3 4 5; do
            if java -cp "$work/old:tests/java/classes" TestPortConflict > "$work/previous.log" 2>&1; then continue; fi
            grep -Eq 'Endpoint not released after shutdown|Rapid restart failed' "$work/previous.log"
            reproduced=true
            echo "Previous listener race reproduced:"
            cat "$work/previous.log"
            break
          done
          if [ "$reproduced" = false ]; then echo "::warning::Previous timing race did not reproduce in this run"; fi
          java -cp tests/java/classes TestPortConflict
      - name: Compare cookie boundaries against the previous HTTP client
        if: github.head_ref != 'codex/local-release-option-a'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          gh api 'repos/Owndot/video-assistent-helper/contents/app/src/main/java/de/evp/helfer/Fetcher.java?ref=80275d518c74ef6404e9afc59579bc7b8cb495f7' --jq .content | base64 --decode > "$work/Fetcher.java"
          javac -cp tests/java/classes -d "$work/old" "$work/Fetcher.java"
          if java -cp "$work/old:tests/java/classes" de.evp.helfer.TestCookie > "$work/old-cookie.log" 2>&1; then
            echo 'Previous cookie boundary unexpectedly passed'; exit 1
          fi
          grep -q 'foreign bob.github.io' "$work/old-cookie.log"
          echo 'Confirmed old tenant-cookie leak; current policy must pass:'
          java -cp tests/java/classes de.evp.helfer.TestCookie
          if java -cp "$work/old:tests/java/classes" de.evp.helfer.TestRedirectCookies --cookies-only > "$work/old-redirect.log" 2>&1; then
            echo 'Old JVM did not expose redirect forwarding; Android still requires device verification'
          else
            grep -q 'Cookie crossed redirect site boundary' "$work/old-redirect.log"
            echo 'Confirmed old native HTTP redirect cookie leak'
          fi
          java -cp tests/java/classes de.evp.helfer.TestRedirectCookies
      - name: Preserve HTTP 300 redirect compatibility
        if: github.head_ref != 'codex/local-release-option-a'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          gh api 'repos/Owndot/video-assistent-helper/contents/app/src/main/java/de/evp/helfer/Fetcher.java?ref=b647432e549993a6674cf4ddbc9f1803f02be0a1' --jq .content | base64 --decode > "$work/Fetcher.java"
          javac -cp tests/java/classes -d "$work/old" "$work/Fetcher.java"
          if java -cp "$work/old:tests/java/classes" de.evp.helfer.TestRedirectCookies > "$work/old-300.log" 2>&1; then
            echo 'Previous missing HTTP300 branch unexpectedly passed'; exit 1
          fi
          grep -q 'HTTP 300 redirect failed' "$work/old-300.log"
          java -cp tests/java/classes de.evp.helfer.TestRedirectCookies
          echo 'PASS: HTTP300 compatibility regression fails predecessor and passes corrected client'
      - name: Record a real pre-fixture debug APK to reproduce the overwrite
        if: github.head_ref == 'codex/local-release-option-a'
        run: |
          set -euo pipefail
          gradle :app:assembleDebug -PmigrationFixtureVersion=122 --no-daemon
          sha256sum app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/pre-fixture-debug.sha256"
      - name: Unsigned release and disposable signing validation
        # run_local_release.sh creates test-only.jks; no production identity is loaded.
        run: bash tests/security/run_local_release.sh
      - name: Prove fixture build invalidates the earlier APK checksum
        if: github.head_ref == 'codex/local-release-option-a'
        run: |
          set -euo pipefail
          if sha256sum --check "$RUNNER_TEMP/pre-fixture-debug.sha256"; then
            echo 'Fixture overwrite failure not reproduced'; exit 1
          fi
          echo 'PASS: real fixture version 123 overwrote version 122; earlier hash is stale'
      - name: Isolated debug APK with disposable test key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          rm -f "$HOME/.android/debug.keystore"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 2 -dname CN=HELPER-CI-TEST-ONLY
          trap 'rm -f "$HOME/.android/debug.keystore"' EXIT
          gradle :app:assembleDebug --no-daemon
      - name: Verify PSL data packaged into the debug APK
        run: |
          python3 - <<'PY'
          import hashlib,zipfile
          with zipfile.ZipFile("app/build/outputs/apk/debug/app-debug.apk") as apk:
              data=apk.read("de/evp/helfer/public_suffix_rules.txt")
          assert hashlib.sha256(data).hexdigest()=="0c203a51804ede904082d7f106322de9ec635431d3c0d982b3dea3c842106436"
          print("PASS: pinned PSL present in APK")
          PY
      - name: Record isolated debug APK provenance
        shell: bash
        run: |
          mkdir -p validation-results
          apk=app/build/outputs/apk/debug/app-debug.apk
          sha256sum "$apk" > validation-results/debug-apk.sha256
          git rev-parse HEAD > validation-results/debug-source-commit.txt
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$aapt" dump badging "$apk" | grep "package: name='de.evp.helfer.debug'"
          "$signer" verify --verbose --print-certs "$apk" | tee validation-results/debug-signature.txt
      - name: JVM media tests
        if: github.head_ref != 'codex/local-release-option-a'
        run: |
          # Use Ubuntu's signed official mirror; the Azure mirror stalled in run40219442784.
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          fi
          timeout 90 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          timeout 180 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install --no-install-recommends -y ffmpeg
          tests/java/run_core_tests.sh
          javac -cp tests/java/classes -d tests/java/classes tests/android_e2e/TestCredentialedStream.java
          java -Xmx32m -cp tests/java/classes de.evp.helfer.TestCredentialedStream
      - name: Prove upload gate rejects stale checksum and signature records
        if: github.head_ref == 'codex/local-release-option-a'
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          cp validation-results/debug-apk.sha256 "$work/final.sha256"
          cp validation-results/debug-signature.txt "$work/final-signature.txt"
          trap 'cp "$work/final.sha256" validation-results/debug-apk.sha256; cp "$work/final-signature.txt" validation-results/debug-signature.txt; rm -rf "$work"' EXIT
          cp "$RUNNER_TEMP/pre-fixture-debug.sha256" validation-results/debug-apk.sha256
          if bash .github/scripts/verify-debug-artifact.sh > "$work/hash.log" 2>&1; then
            echo 'Stale APK hash accepted'; exit 1
          fi
          grep -q 'FAILED' "$work/hash.log"
          cp "$work/final.sha256" validation-results/debug-apk.sha256
          printf '\nSYNTHETIC-STALE-SIGNATURE-RECORD\n' >> validation-results/debug-signature.txt
          if bash .github/scripts/verify-debug-artifact.sh > "$work/signature.log" 2>&1; then
            echo 'Stale signature record accepted'; exit 1
          fi
          grep -Eq 'differ|EOF' "$work/signature.log"
          echo 'PASS: upload gate rejects stale real-APK hash and signature records'
      - name: Verify final debug artifact immediately before upload
        id: debug_artifact_verified
        run: bash .github/scripts/verify-debug-artifact.sh
      - uses: actions/upload-artifact@v4
        if: success() && steps.debug_artifact_verified.outcome == 'success'
        with:
          name: helper-debug-NOT-production
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            validation-results/debug-apk.sha256
            validation-results/debug-source-commit.txt
            validation-results/debug-signature.txt
          if-no-files-found: ignore

  beta-auth-evidence:
    # Explicitly scoped documentation/test review: no browser, emulator or APK jobs.
    if: github.head_ref == 'codex/helper-beta-auth-beta1'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Reject changes outside this documentation and test scope
        run: |
          python3 - <<'PYCODE'
          import subprocess
          allowed = {
              'README.md', 'HELPER-AUTH-DECISION.md', 'HELPER-BETA-SECURITY.md',
              'SECURITY-CORRECTIONS.md', '.github/workflows/build.yml',
              'tests/security/helper_listener.js', 'tests/java/run_beta_auth_tests.sh',
              'tests/java/beta_auth/android/content/Context.java',
              'tests/java/beta_auth/android/content/SharedPreferences.java',
              'tests/java/beta_auth/de/evp/helfer/TestBetaAuth.java',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only','HEAD^1','HEAD^2'],text=True).splitlines())
          assert changed and changed <= allowed, f'Out-of-scope changes: {changed - allowed}'
          print('PASS: only allowlisted documentation/test/workflow changes; runtime sources and artifacts unchanged')
          PYCODE
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Real listener, reset, old-key rejection and restart evidence
        run: bash tests/java/run_beta_auth_tests.sh
      - name: Actual Helper client against a controlled foreign listener
        run: node tests/security/helper_listener.js
      - name: Retrieve reviewed Kadri client source read-only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api 'repos/Owndot/Kadri/contents/src/080-helper-app.js?ref=cc14bcdfb8a7a7d296c32ab3943c74b291be6ac4' --jq .content | base64 --decode > /tmp/kadri-helper.js
      - name: Actual Kadri client against the same controlled listener
        run: node tests/security/helper_listener.js /tmp/kadri-helper.js

  helper-key-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce old stored-key snapshot without modifying main
        if: github.head_ref == 'codex/pairing-key-recovery'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/helper-old/src
          gh api 'repos/Owndot/video-assistent-helper/contents/src/080-helper-app.js?ref=4541036dd8a90c0a661260b7df226eebdadf5978' --jq .content | base64 --decode > /tmp/helper-old/src/080-helper-app.js
          if node tests/security/helper_repair_check.js /tmp/helper-old > /tmp/old-key.log 2>&1; then echo 'Baseline unexpectedly recovered'; exit 1; fi
          grep -q 'userscript kept stale key' /tmp/old-key.log
          echo 'PASS: unchanged main reproduces stale-key failure'
      - name: Current Helper key regression tests
        run: node tests/security/helper_repair_check.js
      - name: Focused userscript and existing security checks
        if: github.head_ref == 'codex/pairing-key-recovery'
        run: |
          node tools/build.js --check
          node tests/security/hls_license.js
          node tests/security/referrer.js
          node tests/security/gm_headers.js

  native-media-memory:
    if: github.head_ref != 'codex/firefox-nine'
    # Fast JVM regressions remain active for future PRs and main; no APK/SDK.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile actual cores and memory regressions
        run: tests/java/build.sh
      - name: Reproduce baseline heap exhaustion
        if: github.head_ref == 'codex/native-media-memory'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          old="$RUNNER_TEMP/memory-baseline"
          mkdir -p "$old/classes"
          gh api 'repos/Owndot/video-assistent-helper/contents/app/src/main/java/de/evp/helfer/Fetcher.java?ref=b42f213d22e5caef63efc3768958923c07077ea3' --jq .content | base64 --decode > "$old/Fetcher.java"
          javac -cp tests/java/classes -d "$old/classes" "$old/Fetcher.java" tests/java/jt/de/evp/helfer/TestMemoryBaseline.java
          java -Xmx32m -cp "$old/classes:tests/java/classes" de.evp.helfer.TestMemoryBaseline
      - name: Reproduce reviewed HTTP framing truncation
        if: github.head_ref == 'codex/native-media-memory'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          old="$RUNNER_TEMP/framing-baseline"
          mkdir -p "$old/classes"
          gh api 'repos/Owndot/video-assistent-helper/contents/app/src/main/java/de/evp/helfer/Fetcher.java?ref=8074aff7f535f9faa738dd97a973fc46ea8de8d1' --jq .content | base64 --decode > "$old/Fetcher.java"
          javac -cp tests/java/classes -d "$old/classes" "$old/Fetcher.java"
          if java -Xmx32m -cp "$old/classes:tests/java/classes" de.evp.helfer.TestResponseFraming > "$old/proof.log" 2>&1; then
            echo 'Reviewed framing regression unexpectedly passed'; exit 1
          fi
          cat "$old/proof.log"
          grep -q 'retains TE=chunked and CL=4 in both APIs; getContentLengthLong=4, decoded=0123456789' "$old/proof.log"
          grep -q 'Framing accepted by production paths: fetch=0123, download=4 bytes (0123)' "$old/proof.log"
          echo 'PASS: real parser exposes both headers; reviewed code silently truncates both outputs'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce old authenticated ingress OOM and browser size-probe buffering
        if: github.head_ref == 'codex/browser-proxy-memory'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          old="$RUNNER_TEMP/proxy-baseline"
          mkdir -p "$old/classes" "$old/src"
          gh api 'repos/Owndot/video-assistent-helper/contents/app/src/main/java/de/evp/helfer/MiniServer.java?ref=f5040b02e3184a995462fbfcb1e6aaf3f3d54adb' --jq .content | base64 --decode > "$old/MiniServer.java"
          javac -cp tests/java/classes -d "$old/classes" "$old/MiniServer.java"
          if timeout 20 java -Xmx32m -cp "$old/classes:tests/java/classes" de.evp.helfer.TestProxyIngress > "$old/ingress.log" 2>&1; then
            echo 'Old ingress unexpectedly passed'; exit 1
          else
            code=$?
          fi
          test "$code" = 1
          cat "$old/ingress.log"
          grep -q 'OutOfMemoryError: Java heap space' "$old/ingress.log"
          gh api 'repos/Owndot/video-assistent-helper/contents/src/080-helper-app.js?ref=f5040b02e3184a995462fbfcb1e6aaf3f3d54adb' --jq .content | base64 --decode > "$old/src/080-helper-app.js"
          if node tests/security/proxy_memory.js "$old" > "$old/browser.log" 2>&1; then echo 'Old size probe unexpectedly passed'; exit 1; fi
          grep -q 'size probe buffered its response body' "$old/browser.log"
          echo 'PASS: actual predecessor exhausts Java heap in authenticated /push and buffers size-probe body'
      - name: Reproduce the reviewed size, identity and cancellation findings
        if: github.head_ref == 'codex/browser-proxy-memory'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          old="$RUNNER_TEMP/review-four"
          mkdir -p "$old/classes" "$old/src"
          for name in Fetcher MiniServer Downloads; do
            gh api "repos/Owndot/video-assistent-helper/contents/app/src/main/java/de/evp/helfer/$name.java?ref=5e52c3228b7907fbced062acf83df47492fe48df" --jq .content | base64 --decode > "$old/$name.java"
          done
          grep -q 'AtomicInteger(100)' "$old/Downloads.java"
          javac -cp tests/java/classes -d "$old/classes" "$old/Fetcher.java" "$old/MiniServer.java"
          if java -Xmx32m -cp "$old/classes:tests/java/classes" de.evp.helfer.TestTransferIntegrity > "$old/size.log" 2>&1; then echo 'Size regression not reproduced'; exit 1; fi
          grep -q 'Eight-byte transfer accepted 6 bytes' "$old/size.log"
          if java -Xmx32m -cp "$old/classes:tests/java/classes" de.evp.helfer.TestJobIdentity --legacy --http > "$old/identity.log" 2>&1; then echo 'Stale identity not reproduced'; exit 1; fi
          grep -q 'Stale upload accepted after process reset: OLD' "$old/identity.log"
          gh api 'repos/Owndot/video-assistent-helper/contents/src/080-helper-app.js?ref=5e52c3228b7907fbced062acf83df47492fe48df' --jq .content | base64 --decode > "$old/src/080-helper-app.js"
          for case in size queue; do
            if node tests/security/proxy_review.js "$old" --case="$case" > "$old/$case-client.log" 2>&1; then echo "Client $case regression not reproduced"; exit 1; fi
          done
          grep -q 'client accepted eight-versus-six bytes with unchanged ETag' "$old/size-client.log"
          grep -q 'cancelled queued GM work started' "$old/queue-client.log"
          echo 'PASS: reviewed production readers/client and authenticated reset transport reproduce the three findings'
      - name: Reproduce legacy full-response and initial-status regressions
        if: github.head_ref == 'codex/browser-proxy-memory'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          old="$RUNNER_TEMP/review-two"
          mkdir -p "$old/classes" "$old/src"
          gh api 'repos/Owndot/video-assistent-helper/contents/app/src/main/java/de/evp/helfer/Fetcher.java?ref=5d5100c9adc34c05bea7b2bb1b1bc3ce24186ea9' --jq .content | base64 --decode > "$old/Fetcher.java"
          javac -cp tests/java/classes -d "$old/classes" "$old/Fetcher.java"
          if java -Xmx32m -cp "$old/classes:tests/java/classes" de.evp.helfer.TestLegacyFullResponse --http > "$old/length.log" 2>&1; then echo 'Legacy length regression not reproduced'; exit 1; fi
          grep -q 'Legacy HTTP200 accepted eight-byte prefix: 01234567' "$old/length.log"
          gh api 'repos/Owndot/video-assistent-helper/contents/src/080-helper-app.js?ref=5d5100c9adc34c05bea7b2bb1b1bc3ce24186ea9' --jq .content | base64 --decode > "$old/src/080-helper-app.js"
          if node tests/security/proxy_initial_status.js "$old" > "$old/status.log" 2>&1; then echo 'Initial status regression not reproduced'; exit 1; fi
          grep -q 'initial status timeout discarded pulled work' "$old/status.log"
          echo 'PASS: reviewed production code accepts the wrong prefix over HTTP and drops the timed-out initial batch'
      - name: Proxy streaming, browser bounds and unchanged authentication
        run: |
          java -Xmx32m -cp tests/java/classes de.evp.helfer.TestLegacyFullResponse
          java -Xmx32m -cp tests/java/classes de.evp.helfer.TestLegacyFullResponse --http
          java -Xmx32m -cp tests/java/classes de.evp.helfer.TestTransferIntegrity
          java -Xmx32m -cp tests/java/classes de.evp.helfer.TestJobIdentity
          java -Xmx32m -cp tests/java/classes de.evp.helfer.TestJobIdentity --http
          bash tests/java/run_job_id_processes.sh
          java -Xmx32m -cp tests/java/classes de.evp.helfer.TestProxyMemory
          java -Xmx32m -cp tests/java/classes de.evp.helfer.TestProxyIngress
          node tests/security/proxy_initial_status.js
          node tests/security/proxy_review.js
          node --max-old-space-size=32 --expose-gc tests/security/proxy_memory.js
          node tests/security/gm_headers.js
          node tools/build.js --check
          node tests/security/hls_license.js
      - name: Bounded memory, ranges, cancellation and real HTTP
        run: |
          java -Xmx32m -cp tests/java/classes de.evp.helfer.TestResponseFraming --simulated
          java -Xmx32m -cp tests/java/classes de.evp.helfer.TestResponseFraming
          java -Xmx32m -cp tests/java/classes de.evp.helfer.TestMemoryWindows
          java -Xmx32m -cp tests/java/classes de.evp.helfer.TestMemoryHttp
      - name: Native media and existing proxy compatibility
        # This PR skips the broad Android/browser jobs. Reuse existing fixtures here once.
        if: github.head_ref == 'codex/native-media-memory' || github.head_ref == 'codex/browser-proxy-memory'
        run: |
          set -euo pipefail
          # Hosted runners can resolve Ubuntu through mirror+file lists as well as deb822.
          for source in /etc/apt/apt-mirrors.txt /etc/apt/apt-mirrors-security.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$source" ]; then
              sudo sed -Ei 's#https?://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' "$source"
            fi
          done
          timeout 90 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
          timeout 180 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install --no-install-recommends -y ffmpeg
          tests/java/run_core_tests.sh
          javac -cp tests/java/classes -d tests/java/classes tests/android_e2e/TestCredentialedStream.java
          java -Xmx32m -cp tests/java/classes de.evp.helfer.TestCredentialedStream
