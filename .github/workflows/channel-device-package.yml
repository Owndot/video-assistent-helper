name: Helper channel device package (test package only, upload gated twice)

# Baut AUSSCHLIESSLICH die Testvariante de.evp.helfer.channeltest („TEST Helper-Kanal“) für den Gerätetest auf dem
# Samsung Galaxy S26 Ultra: zweimal aus verschiedenen Pfaden (Reproduzierbarkeit), signiert mit je einem in diesem
# Job erzeugten und danach gelöschten Wegwerf-Schlüssel, prüft Paket, Signierer, Sicherungsregeln und Bibliotheken,
# führt die Instrumentierungstests gegen GENAU diese APK auf einem Wegwerf-Emulator aus und schreibt SHA-256-Werte.
#
# Nie de.evp.helfer, nie ein produktiver oder früherer Schlüssel, kein Release, kein Tag.
#
# Das Repository ist ÖFFENTLICH: Ein Artefakt wäre eine Veröffentlichung. Die installierbare APK wird nur hochgeladen,
# wenn BEIDE Freigaben vorliegen:
#   1. Der Eigentümer hat .github/CHANNEL-DEVICE-ARTIFACTS-APPROVED committet (Vorlage: …APPROVED.template).
#   2. Der Lauf wurde von Hand gestartet (workflow_dispatch) mit confirm_upload = "UPLOAD-TEST-APK".
# Fehlt eine davon, verlässt nichts Installierbares den Runner (nur Text: Hashes, Prüfergebnisse).
on:
  push:
    branches: [feature/helper-channel-control]
    paths: ['.github/workflows/channel-device-package.yml', '.github/CHANNEL-DEVICE-ARTIFACTS-APPROVED']
  workflow_dispatch:
    inputs:
      confirm_upload:
        description: 'Nur mit Freigabedatei: "UPLOAD-TEST-APK" lädt die Test-APK für 1 Tag hoch. Leer = nur bauen und prüfen.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: channel-device-package
  cancel-in-progress: true

env:
  NDK_VERSION: 27.2.12479018

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Production policy UNAPPROVED; upload decision
        id: gate
        env:
          CONFIRM: ${{ github.event.inputs.confirm_upload }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          grep -q '"status": "UNAPPROVED"' release/production-policy.json
          upload=no
          if [ -f .github/CHANNEL-DEVICE-ARTIFACTS-APPROVED ] && [ "$EVENT" = workflow_dispatch ] && [ "$CONFIRM" = "UPLOAD-TEST-APK" ]; then upload=yes; fi
          echo "upload=$upload" >> "$GITHUB_OUTPUT"
          echo "production policy: UNAPPROVED; upload: $upload"
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Pinned toolchains (Rust from rust-toolchain.toml, NDK r27c, SDK 34, build-tools 34.0.0)
        run: |
          set -euo pipefail
          (cd poc/pake-channel/core && rustup show active-toolchain && rustc -V)
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "platforms;android-34" "build-tools;34.0.0" < <(yes 2>/dev/null) > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Build A (checkout) and build B (copy in another path), each with its own throwaway signer
        run: |
          set -euo pipefail
          bash tools/build-channel-native.sh "$RUNNER_TEMP/a"
          bash tools/build-channel-apk.sh "$RUNNER_TEMP/a"
          mkdir -p "$RUNNER_TEMP/src-b" && git archive HEAD | tar -x -C "$RUNNER_TEMP/src-b"
          (cd "$RUNNER_TEMP/src-b" && bash tools/build-channel-native.sh "$RUNNER_TEMP/b" && bash tools/build-channel-apk.sh "$RUNNER_TEMP/b")
      - name: Reproducibility - native libraries byte-identical, APK contents identical apart from the signature
        run: |
          set -euo pipefail
          for d in a b; do (cd "$RUNNER_TEMP/$d" && sha256sum jniLibs/*/*.so jniLibs-test/*/*.so) > "$RUNNER_TEMP/$d.libs"; done
          diff "$RUNNER_TEMP/a.libs" "$RUNNER_TEMP/b.libs"
          entries() { python3 - "$1" <<'PY'
          import hashlib, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              for n in sorted(z.namelist()):
                  if n.startswith('META-INF/'): continue   # Signaturdateien (Wegwerf-Schlüssel je Bau)
                  print(hashlib.sha256(z.read(n)).hexdigest(), n)
          PY
          }
          for apk in helper-channeltest.apk helper-channeltest-androidTest.apk; do
            entries "$RUNNER_TEMP/a/apk/$apk" > "$RUNNER_TEMP/a.$apk.entries"
            entries "$RUNNER_TEMP/b/apk/$apk" > "$RUNNER_TEMP/b.$apk.entries"
            if ! diff "$RUNNER_TEMP/a.$apk.entries" "$RUNNER_TEMP/b.$apk.entries"; then
              # Diagnose: welche Klassen/Methoden unterscheiden sich? (Der Schritt bleibt rot.)
              BT="$ANDROID_HOME/build-tools/34.0.0"
              for f in $(diff <(cut -d' ' -f1,2 "$RUNNER_TEMP/a.$apk.entries") <(cut -d' ' -f1,2 "$RUNNER_TEMP/b.$apk.entries") | sed -n 's/^< [0-9a-f]* //p' | grep '\.dex$'); do
                for d in a b; do mkdir -p "$RUNNER_TEMP/dex-$d"; unzip -p "$RUNNER_TEMP/$d/apk/$apk" "$f" > "$RUNNER_TEMP/dex-$d/$f"; "$BT/dexdump" -d "$RUNNER_TEMP/dex-$d/$f" > "$RUNNER_TEMP/dex-$d/$f.txt" 2>&1 || true; done
                echo "== $apk:$f – Klassen nur in A/B:"; diff <(grep -E "Class descriptor" "$RUNNER_TEMP/dex-a/$f.txt" | sort) <(grep -E "Class descriptor" "$RUNNER_TEMP/dex-b/$f.txt" | sort) | head -40 || true
                echo "== $apk:$f – erste Unterschiede im Inhalt:"; diff "$RUNNER_TEMP/dex-a/$f.txt" "$RUNNER_TEMP/dex-b/$f.txt" | head -80 || true
              done
              exit 1
            fi
            echo "REPRODUCIBLE content of $apk: $(wc -l < "$RUNNER_TEMP/a.$apk.entries") entries; content hash $(sha256sum < "$RUNNER_TEMP/a.$apk.entries" | cut -c1-16)"
          done
          cat "$RUNNER_TEMP/a.libs"
      - name: Verification script (used before and after the emulator)
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/verify-apk.sh" <<'SH'
          #!/usr/bin/env bash
          # verify-apk.sh APK -> prints the facts that must stay identical; exits non-zero on any violation.
          set -euo pipefail
          APK="$1"; BT="$ANDROID_HOME/build-tools/34.0.0"; TC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          W="$(mktemp -d)"; trap 'rm -rf "$W"' EXIT
          badging="$("$BT/aapt2" dump badging "$APK")"
          echo "$badging" | grep -q "^package: name='de.evp.helfer.channeltest'" || { echo "wrong package" >&2; exit 1; }
          echo "$badging" | grep -q "application-label:'TEST Helper-Kanal'" || { echo "unexpected label" >&2; exit 1; }
          echo "$badging" | grep -q "native-code: 'arm64-v8a' 'x86_64'" || { echo "unexpected ABIs" >&2; exit 1; }
          manifest="$("$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK")"
          grep -q 'allowBackup.*=false' <<<"$manifest" || { echo "allowBackup not false" >&2; exit 1; }
          grep -q 'dataExtractionRules' <<<"$manifest" || { echo "dataExtractionRules missing" >&2; exit 1; }
          certs="$("$BT/apksigner" verify --verbose --print-certs "$APK")"
          test "$(echo "$certs" | grep -c '^Signer #[0-9]* certificate DN')" = 1 || { echo "not exactly one signer" >&2; exit 1; }
          echo "$certs" | grep -q "Signer #1 certificate DN: CN=Helper channel TEST ONLY - throwaway" || { echo "not the throwaway signer" >&2; exit 1; }
          "$BT/apksigner" verify --print-certs-pem "$APK" | sed -n '/BEGIN CERTIFICATE/,/END CERTIFICATE/p' > "$W/cert.pem"
          start="$(openssl x509 -in "$W/cert.pem" -noout -startdate | cut -d= -f2)"; end="$(openssl x509 -in "$W/cert.pem" -noout -enddate | cut -d= -f2)"
          days=$(( ( $(date -d "$end" +%s) - $(date -d "$start" +%s) ) / 86400 ))
          [ "$days" -le 3 ] || { echo "certificate valid $days days: not a throwaway certificate" >&2; exit 1; }
          libs="$(unzip -Z1 "$APK" | grep '^lib/' | sort)"
          [ "$libs" = "$(printf 'lib/arm64-v8a/libkadri_pairing_poc.so\nlib/x86_64/libkadri_pairing_poc.so')" ] || { echo "unexpected native libraries: $libs" >&2; exit 1; }
          for abi in arm64-v8a x86_64; do
            unzip -p "$APK" "lib/$abi/libkadri_pairing_poc.so" > "$W/$abi.so"
            machine="$("$TC/llvm-readelf" -h "$W/$abi.so" | sed -n 's/^ *Machine: *//p')"
            case "$abi:$machine" in arm64-v8a:AArch64|x86_64:*X86-64*) ;; *) echo "architecture mismatch $abi:$machine" >&2; exit 1 ;; esac
            if "$TC/llvm-nm" -D --defined-only "$W/$abi.so" | grep -q Java_poc_TestInitiator_; then echo "test initiator in app library" >&2; exit 1; fi
          done
          echo "apk_sha256=$(sha256sum < "$APK" | cut -d' ' -f1)"
          echo "$badging" | grep -E "^package:|^sdkVersion|^targetSdkVersion|^native-code|^application-label:"
          echo "$certs" | grep -E "Number of signers|Signer #1 certificate (DN|SHA-256 digest)"
          echo "cert_validity_days=$days"
          for abi in arm64-v8a x86_64; do echo "lib/$abi/libkadri_pairing_poc.so sha256=$(sha256sum < "$W/$abi.so" | cut -d' ' -f1)"; done
          SH
          chmod +x "$RUNNER_TEMP/verify-apk.sh"
      - name: Verify the APK and record its hash BEFORE the emulator
        run: |
          set -euo pipefail
          chmod a-w "$RUNNER_TEMP/a/apk/"*.apk
          "$RUNNER_TEMP/verify-apk.sh" "$RUNNER_TEMP/a/apk/helper-channeltest.apk" | tee "$RUNNER_TEMP/before.txt"
          sha256sum "$RUNNER_TEMP/a/apk/"*.apk | tee "$RUNNER_TEMP/apks-before.sha256"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumentation against exactly these APKs (disposable API 34 emulator)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash tools/run-channel-instrumentation.sh "$RUNNER_TEMP/a"
      - name: AFTER the emulator - same file, same hash, same package, signer and libraries
        run: |
          set -euo pipefail
          sha256sum -c "$RUNNER_TEMP/apks-before.sha256"
          "$RUNNER_TEMP/verify-apk.sh" "$RUNNER_TEMP/a/apk/helper-channeltest.apk" > "$RUNNER_TEMP/after.txt"
          diff -u "$RUNNER_TEMP/before.txt" "$RUNNER_TEMP/after.txt"
          grep -q '^OK (' "$RUNNER_TEMP/a/report/instrumentation.txt"
          echo "PASS: APK unchanged by the emulator step; instrumentation OK"
      - name: SHA256SUMS (only after the comparison) and the exact file for delivery
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/deliver"; mkdir -p "$D"
          cp "$RUNNER_TEMP/a/apk/helper-channeltest.apk" "$D/helper-channeltest.apk"
          test "$(sha256sum < "$D/helper-channeltest.apk" | cut -d' ' -f1)" = "$(sed -n 's/^apk_sha256=//p' "$RUNNER_TEMP/after.txt")"
          (cd "$D" && sha256sum helper-channeltest.apk > SHA256SUMS)
          grep -E "^lib/|certificate SHA-256 digest" "$RUNNER_TEMP/after.txt" >> "$D/SHA256SUMS"
          printf 'helper_commit=%s\nworkflow_run=%s\n' "$(git rev-parse HEAD)" "${{ github.run_id }}" >> "$D/SHA256SUMS"
          cp "$RUNNER_TEMP/a/report/summary.txt" "$D/instrumentation-summary.txt"
          chmod a-w "$D"/*
          cat "$D/SHA256SUMS"
      - name: Upload is gated (text report only)
        if: steps.gate.outputs.upload != 'yes'
        run: |
          echo "Not uploaded: needs .github/CHANNEL-DEVICE-ARTIFACTS-APPROVED AND a manual run with confirm_upload=UPLOAD-TEST-APK."
          echo "Nothing installable leaves the runner."
          mkdir -p "$RUNNER_TEMP/text" && cp "$RUNNER_TEMP/deliver/SHA256SUMS" "$RUNNER_TEMP/deliver/instrumentation-summary.txt" "$RUNNER_TEMP/text/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.gate.outputs.upload != 'yes'
        with:
          name: helper-channel-device-package-report-text-only
          path: ${{ runner.temp }}/text
          retention-days: 7
      - name: Last check before upload - the delivery file is the tested file
        if: steps.gate.outputs.upload == 'yes'
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/deliver"
          (cd "$D" && sha256sum -c <(head -1 SHA256SUMS))
          test "$(head -1 "$D/SHA256SUMS" | cut -d' ' -f1)" = "$(sed -n 's/^apk_sha256=//p' "$RUNNER_TEMP/before.txt")"
          ls -l "$D"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.gate.outputs.upload == 'yes'
        with:
          name: helper-channeltest-${{ github.run_id }}
          path: ${{ runner.temp }}/deliver
          retention-days: 1
          if-no-files-found: error
